  {id:"area_eval",cat:"eval",depth:4,name:"Evaluation",sub:"Branch \u00b7 whether it worked, and how anyone would know",body:"The design of the evidence a learning programme produces about itself. This branch gathers the contributions that build measurement into practice from the first cycle rather than adding it at the end: what can be established when there is no baseline, what can be claimed at small numbers, how a portfolio is measured when capacity covers only part of it, and how findings are shaped so that a decision can rest on them. It draws on the evaluation contributions held elsewhere on the map and situates them in a shared method.",ground:"Evaluation design; contribution analysis; utilization-focused evaluation; measurement validity",link:"eval",status:"planned",added:true,connects:["c0","ev0","ev1","ev4","sd_eval"]},
  {id:"ev0",cat:"eval",depth:3,name:"Standing Up an Evaluation Function",sub:"The first cycle, before there is anything to compare against",body:"Establishing evaluation in an organization that has not carried it before: deciding what can be instrumented immediately, what is worth waiting a cycle to measure well, and what can be reconstructed from records already held. The sequence matters, because the first cycle sets the baseline every later cycle will read against, and because consent, retention and reporting arrangements are easier to establish at the outset than to retrofit.",ground:"Evaluation design; programme theory; baseline and instrumentation planning",link:"eval",status:"planned",added:true,connects:["area_eval","sd_eval","sd_org","ld18","ev4"]},
  {id:"ev1",cat:"eval",depth:4,name:"Evaluating at Small Numbers",sub:"Sound inference without a comparison group",body:"Most evaluation method assumes a scale that many learning programmes will never reach. Single-case and n-of-1 designs, contribution analysis, most-significant-change, and information power as an alternative to a target sample size each support a defensible claim from a single cohort. The corresponding discipline is knowing which claims the design can carry and stating the rest as description.",ground:"Contribution analysis (Mayne); single-case design (Kazdin); information power (Malterud); most significant change (Davies & Dart)",link:"eval",status:"planned",added:true,connects:["area_eval","ev4","km2","ep9","sd3"]},
  {id:"ev2",cat:"eval",depth:2,name:"Evaluating a Portfolio Larger Than Its Measurement Capacity",sub:"A stated rule for where the evidence effort goes",body:"When an organization runs more programmes than it can evaluate, measurement is tiered rather than uniform: full evaluation for a named few, a single agreed signal for many, and periodic sampling across the rest. Setting the tiering rule in advance, and recording it, makes the coverage legible to everyone whose work sits inside it and gives the portfolio a defensible account of what it knows and where.",ground:"Evaluation planning; portfolio sampling; exploration and exploitation (March)",link:"eval",status:"planned",added:true,connects:["area_eval","sd11","sd_eval","ld13"]},
  {id:"ev3",cat:"eval",depth:3,name:"Reporting to Funders Alongside Learning from the Work",sub:"Two purposes, each served properly",body:"Accountability reporting and improvement evaluation answer to different readers and reward different things, and a single instrument asked to do both tends to serve one well. Designing them as a related pair \u2014 shared data collection, distinct analyses and outputs \u2014 lets a grant report stand up to scrutiny while the programme retains evidence it can act on. It also keeps what is promised in an application within what the design will be able to evidence later.",ground:"Accountability and organizational learning (Ebrahim); measurement effects on programmes (Campbell)",link:"eval",status:"planned",added:true,connects:["area_eval","ev4","km2","ld25","pl3"]},
  {id:"ev4",cat:"eval",depth:4,name:"Designing Evaluation Backwards from the Decision",sub:"Naming the decision each measure informs",body:"Evaluation earns its cost when each measure is attached to a decision someone is already committed to making, with the threshold agreed in advance and the route to acting on the result identified before data collection begins. Utilization-focused design starts from intended use by intended users, which places the question of who will act, and on what, at the beginning rather than at the report stage.",ground:"Utilization-focused evaluation (Patton); evaluation use (Weiss)",link:"eval",status:"planned",added:true,connects:["area_eval","ev0","ev1","sd_eval","ld25","ld32"]},
  {id:"area_public",cat:"public",depth:4,name:"Public Learning",sub:"Branch \u00b7 learning nobody is required to do, and the infrastructure it depends on",body:"Learning designed for people who are not enrolled: visitors, community members, practitioners outside the academy, and anyone who arrives voluntarily and may leave at any moment. This branch gathers the contributions that address the encounter itself \u2014 attention, groups, objects, interpretation, and the public room \u2014 alongside the infrastructure that makes public learning possible, from access to the research literature to community-held records. Museums, science centres, galleries, libraries and public programmes are its settings.",ground:"Free-choice learning; museum education; visitor studies; open access; public library and information literacy practice",link:"public",status:"planned",added:true,connects:["c0","pl0","pl2","pl6","lx3"]},
  {id:"pl0",cat:"public",depth:4,name:"Learning Nobody Is Required to Do",sub:"The entry node \u00b7 attention as the working budget",body:"Without enrolment, completion or consequence for leaving, continuation is granted moment by moment and every element has to earn it again. Studies of visitor time establish that most people spend well under half an hour in an exhibition and stop at a minority of what is available, which sets an honest ceiling on what a single encounter can be designed to achieve and directs the design toward interest, orientation and a reason to return.",ground:"Free-choice learning (Falk & Dierking); visitor time and attention (Serrell); Learning Science in Informal Environments (NRC)",link:"public",status:"planned",added:true,connects:["area_public","pl1","pl5","lx1","ud3"]},
  {id:"pl1",cat:"public",depth:3,name:"Designing for Groups Who Arrive Together",sub:"The conversation is where the learning travels",body:"Families, school groups and pairs of friends arrive as a unit, and the accompanying adult interprets while also learning. Research on museum conversation shows that what people say to each other in front of an exhibit is a principal route through which understanding forms, which makes the design object the exchange rather than the individual: prompts that give an adult something to ask, and content that supports several reading levels at one label.",ground:"Learning conversations in museums (Leinhardt, Crowley & Knutson); sociocultural learning (Vygotsky); free-choice learning",link:"public",status:"planned",added:true,connects:["area_public","pl0","lx4","ld11"]},
  {id:"pl2",cat:"public",depth:4,name:"Interpretation Bound to an Object and Its Provenance",sub:"What the collection holds, and how it came to be held",body:"In collection-based settings the content available is the content the institution holds, and the history of how each object arrived is part of what the label is answering for. Interpretation is therefore developed with the communities to whom the material belongs and whose knowledge it carries, with authorship, protocol and the terms of display settled alongside the text rather than after it.",ground:"Interpretation (Serrell); difficult heritage (Macdonald); ethical space (Ermine); OCAP\u00ae principles",link:"public",status:"planned",added:true,connects:["area_public","hr5","ld27","km9","ep8"]},
  {id:"pl3",cat:"public",depth:3,name:"Making the Case for Public Learning Outcomes",sub:"Interest, identity and participation, evidenced",body:"Public learning produces outcomes that arrive slowly and diffusely \u2014 interest, confidence, a sense that a field is open to the person standing in it \u2014 while funding decisions often expect the shorter, school-shaped kind. The strands of informal science learning set out in the National Research Council synthesis give these outcomes a documented structure, which supports proposals and reports that describe what public programmes genuinely do and evidence it on its own terms.",ground:"Strands of informal science learning (NRC); free-choice learning; evaluation of public programmes",link:"public",status:"planned",added:true,connects:["area_public","ev3","km4","ld25","pl9"]},
  {id:"pl4",cat:"public",depth:3,name:"Delivery by Volunteers and Casual Teams",sub:"Designed to hold in the hands of a short-notice team",body:"Much public programming is delivered by volunteers, students and casual staff who join for a season and receive a short orientation. The design response is to decide deliberately what is fixed and what is left to the person: a small number of well-rehearsed moves, prompts and worked examples in hand, and a clear account of what to do when a question runs past the brief.",ground:"Legitimate peripheral participation (Lave & Wenger); job aids and performance support (Rossett & Schafer)",link:"public",status:"planned",added:true,connects:["area_public","ld21","ld23","ac3","lx4"]},
  {id:"pl5",cat:"public",depth:3,name:"Access in a Public Room",sub:"The building, the crowd, and who is able to come",body:"Public settings add conditions that a document-centred approach to accessibility does not reach: sound levels, crowding, sightlines, seating, reach and operating force at an interactive, and the sensory load of a busy gallery. Alongside these sit the conditions that determine attendance at all \u2014 admission cost, transport, opening hours and distance \u2014 so that scheduled low-sensory times and subsidised access are programme decisions as much as facilities ones.",ground:"Universal design (Center for Universal Design); accessible physical environments; CRPD Article 30",link:"public",status:"planned",added:true,connects:["area_public","ac25","ac13","ud8","pl0"]},
  {id:"pl6",cat:"public",depth:4,name:"Access to the Evidence Itself",sub:"Whether the reader can open what the work cites",body:"Practitioners, community organizations and independent researchers frequently work outside the subscriptions their evidence base sits behind. Designing for this means citing what the reader can reach, using open-access versions and repository copies where they exist, and treating access arrangements \u2014 community borrower programmes, open licensing, deposit practice \u2014 as part of the knowledge product rather than as someone else's concern.",ground:"Open access (Suber; Budapest Open Access Initiative); public library mandate (IFLA-UNESCO)",link:"public",status:"planned",added:true,connects:["area_public","km4","pl7","ep2","ep3"]},
  {id:"pl7",cat:"public",depth:3,name:"The Reference Encounter as Teaching",sub:"One conversation, an unknown starting point, no second session",body:"A staffed desk in a library or learning centre delivers a large share of an institution's teaching, one enquiry at a time, to people whose prior knowledge is unknown and who may not return. The established reference interview \u2014 establishing the actual question, negotiating scope, and closing by checking that the answer was usable \u2014 is a compact instructional method, and it pairs with information literacy frameworks to make a single encounter transferable rather than transactional.",ground:"Reference interview (Ross, Nilsen & Radford); ACRL Framework for Information Literacy",link:"public",status:"planned",added:true,connects:["area_public","ld31","pl6","km7","ld23"]},
  {id:"pl8",cat:"public",depth:3,name:"Community-Held Records and Community-Led Digitization",sub:"Capability transferred, and the files kept where they belong",body:"Community archives and digitization initiatives are strongest when the institution supplies equipment, training and standards while the community holds the material, the decisions and the resulting files. Toolkits, workshops and documented workflows are the design deliverables; ownership, control, access and possession of the records remain with the community throughout.",ground:"OCAP\u00ae principles (FNIGC); ethical space (Ermine); Indigenous storywork (Archibald)",link:"public",status:"planned",added:true,connects:["area_public","ld27","km9","km7","pl2"]},
  {id:"pl9",cat:"public",depth:2,name:"Evaluating an Anonymous Encounter",sub:"No roster, no follow-up, and evidence all the same",body:"Public settings rarely permit named participants or later contact, so evaluation is built from what can be observed and asked in the moment: tracking and timing, structured observation, brief exit conversations, and repeat cross-sectional sampling across a season. Each method answers a narrow question well, and stating which question it answers keeps the resulting claims proportionate.",ground:"Tracking and timing (Serrell); visitor studies methods; informal learning evaluation",link:"public",status:"planned",alsoIn:"eval",added:true,connects:["area_public","ev1","pl0","pl3","ld32"]},
  {id:"area_hr",cat:"hr",depth:4,name:"Human Rights Education",sub:"Branch \u00b7 rights that people can understand, claim and use",body:"Education about, through and for human rights, as set out in the United Nations Declaration on Human Rights Education and Training. This branch gathers the contributions that turn instruments into practice: the right to education itself as a design framework, the established models of human rights education and what each is for, the move from knowing a right to being able to invoke it, and the conditions under which serious harm can be taught well. It is the branch the accessibility and equity work draws its legal grounding from.",ground:"United Nations Declaration on Human Rights Education and Training; the right to education (Toma\u0161evski; CESCR General Comment 13); models of human rights education (Tibbitts; Bajaj)",link:"hr",status:"planned",added:true,connects:["c0","hr0","hr1","hr2","ac5"]},
  {id:"hr0",cat:"hr",depth:5,name:"The Right to Education Itself",sub:"The anchor \u00b7 available, accessible, acceptable, adaptable",body:"The 4-A scheme developed by the United Nations Special Rapporteur on the right to education, and affirmed in General Comment 13, sets out what states owe: that education exists, that people can reach it, that its form and content are acceptable to those receiving it, and that it adapts to their circumstances. Read as a design framework it gives learning design a vocabulary drawn from international law for questions it already asks, and connects each to an established obligation.",ground:"4-A scheme (Toma\u0161evski); CESCR General Comment 13; UDHR Article 26; ICESCR Article 13; CRC Articles 28\u201329; CRPD Article 24",link:"hr",status:"planned",added:true,connects:["area_hr","hr1","hr2","ac24","ac5","ud8"]},
  {id:"hr1",cat:"hr",depth:4,name:"Models of Human Rights Education",sub:"Awareness, accountability, transformation \u2014 and choosing between them",body:"Three widely used models describe what a human rights education programme is actually for: building shared values and awareness, equipping professionals to meet obligations they already hold, and supporting people affected by rights violations to act. Each implies different learners, content and evidence of success. Identifying which model a request belongs to, early, is what allows a programme to be designed and evaluated coherently.",ground:"Models of human rights education (Tibbitts); ideology, location and approaches (Bajaj); World Programme for Human Rights Education",link:"hr",status:"planned",added:true,connects:["area_hr","hr0","hr2","hr4","ld1"]},
  {id:"hr2",cat:"hr",depth:3,name:"Rights That Can Be Used, Not Only Known",sub:"From the instrument to the claim a person can make",body:"Knowing that a right exists and being able to invoke it are separate capabilities, and the second is where most programmes have room to grow. The design work is concrete: which body receives the claim, what a complaint contains, what timelines apply, what support exists, and rehearsal of the request itself \u2014 so that the learning ends closer to action than to awareness.",ground:"Education for human rights (UN Declaration on Human Rights Education and Training); transformative agency (Bajaj); critical pedagogy (Freire)",link:"hr",status:"planned",added:true,connects:["area_hr","hr0","hr4","ud4","ld26"]},
  {id:"hr3",cat:"hr",depth:3,name:"Teaching About Serious Harm",sub:"Content whose subject is present in the room",body:"Some rights content concerns events that participants, their families or their communities have lived through, and the alternative to teaching it carries its own costs. The design commitments are stated in advance and hold throughout: what will be covered and when, pacing that can be adjusted, participation that does not require anyone to account for their own experience, and a route out of the room that costs nothing to use.",ground:"Difficult knowledge (Britzman); pedagogy of discomfort (Boler); trauma-informed educational practice (Carello & Butler); SAMHSA framework",link:"hr",status:"planned",added:true,connects:["area_hr","ld34","ld35","ld37","km9"]},
  {id:"hr4",cat:"hr",depth:2,name:"Rights Education Inside the Duty-Bearing Institution",sub:"When the organization teaching the right also owes it",body:"Workplace and institutional rights education is usually delivered by the body that holds the corresponding obligation. Designing it well means naming that position openly, giving accurate routes to internal and external recourse including those outside the organization, and separating the record of who attended from anything that could identify what an individual disclosed.",ground:"Duty-bearer obligations (UN Declaration on Human Rights Education and Training); human rights codes and complaint procedures; privacy in learning records",link:"hr",status:"planned",added:true,connects:["area_hr","hr1","hr2","ld17","ld18","ac5"]},
  {id:"hr5",cat:"hr",depth:3,name:"Human Rights in Public Interpretation",sub:"Rights content in a gallery, a memorial or a public programme",body:"Public settings reach audiences that no course reaches, and increasingly carry rights content: contested collections, memorials, and exhibitions on histories of harm. The interpretive questions are who narrates, what the visitor is told about provenance, and how a self-directed visitor of any age and background is supported through material of this weight in a short, unsupervised encounter.",ground:"Difficult heritage (Macdonald); interpretation (Serrell); Calls to Action (TRC); museum education (Hooper-Greenhill)",link:"hr",status:"planned",alsoIn:"public",added:true,connects:["area_hr","pl2","pl0","hr3","ld27"]},
  {id:"hr6",cat:"hr",depth:3,name:"Selection, Identification and the Right to Education",sub:"How places are allocated, and who is identified for them",body:"Streaming, enrichment placement, admissions screens and eligibility criteria distribute educational opportunity, and the acceptability and adaptability obligations apply directly to them. Documenting the criterion actually used, who is identified by it and who is not, and what alternative routes exist, brings selection into the same evidentiary frame as any other design decision.",ground:"4-A scheme (Toma\u0161evski); CESCR General Comment 13; construct validity (Messick); equity evaluation (Mertens)",link:"hr",status:"planned",added:true,connects:["area_hr","hr0","ud7","sd3","ep9"]},
  {id:"lx11",cat:"lxd",depth:4,name:"Studio and Workshop Pedagogy",sub:"Teaching in a space where the work is made",body:"Learning organized around production in a shared, equipped space: demonstration, supervised practice, progressive release of independence, and authorization to work unaccompanied once competence is shown. It is among the oldest teaching structures in the professions, and the reflective practicum was theorised from it, yet little of its method has been carried into mainstream design practice.",ground:"Reflective practicum (Sch\u00f6n); signature pedagogies (Shulman); cognitive apprenticeship (Collins, Brown & Newman); craft (Sennett)",link:"lxd",status:"planned",added:true,connects:["area_lxd","lx3","ep5","sd16","lx13"]},
  {id:"lx12",cat:"lxd",depth:3,name:"The Critique as an Assessment Form",sub:"Public, spoken feedback, designed well",body:"The critique gives feedback in front of peers, in the presence of the work, and develops the ability to discuss one's own practice \u2014 something no written rubric produces. Designing it well means stating the criteria beforehand, structuring who speaks and in what order, protecting time so later work is heard as fully as earlier work, and providing a written record so the session is usable afterwards.",ground:"Art and design pedagogy (Orr & Shreeve); feedback (Hattie & Timperley); construct-irrelevant barriers (Messick)",link:"lxd",status:"planned",added:true,connects:["area_lxd","lx7","ud7","lx11","ld29"]},
  {id:"lx13",cat:"lxd",depth:2,name:"Materials, Tools and Equipment as Access Variables",sub:"What the work costs to make, and who can operate the machine",body:"In making-based programmes the material budget, the studio timetable and the physical demands of equipment shape who can fully take part. Costed material kits, consumable pools, timetabled access that accommodates commuting and caregiving, and equipment selected for reach, force and seated operation are the design responses, and they belong in the programme plan rather than in individual accommodation.",ground:"Universal design (Center for Universal Design); scarcity and cognitive bandwidth (Mullainathan & Shafir); accessible environments",link:"lxd",status:"planned",added:true,connects:["area_lxd","lx11","ac25","ud9","ud8"]},
  {id:"lx14",cat:"lxd",depth:3,name:"Designing For and Within Practice-Based Research",sub:"When the work made is part of the finding",body:"Research-creation and practice-led inquiry produce knowledge through making, which changes how a project is scoped, supervised, documented and examined. Designing learning in these settings means building documentation into production rather than reconstructing it afterwards, and making the criteria for a practice-based contribution explicit to everyone assessing it.",ground:"Practice as research (Barrett & Bolt); knowing-how (Ryle); tacit knowledge (Polanyi; Collins)",link:"lxd",status:"planned",alsoIn:"epist",added:true,connects:["area_lxd","ep5","ld33","lx11","ld19"]},
  {id:"lx15",cat:"lxd",depth:3,name:"Partnered Studio and Client Projects",sub:"An external partner, a live brief, and learners in the middle",body:"Projects run with an industry, community or institutional partner give learners real constraints and real audiences. Holding the educational purpose steady alongside the partner's needs calls for an agreement settled in advance: scope and timeline, ownership of what is produced, consent and credit for participants, and a defined position if the brief changes mid-project.",ground:"Work-integrated learning (Billett); situated learning; research ethics (TCPS 2)",link:"lxd",status:"planned",added:true,connects:["area_lxd","lx3","lx16","ld19","ld33"]},
  {id:"lx16",cat:"lxd",depth:3,name:"The Workplace Partner Who Does Most of the Teaching",sub:"Supervisors as the largest and least supported teaching group",body:"In placements, co-ops and practicums the day-to-day teaching is done by workplace supervisors whose primary role is something else. Supporting them well is a design problem in its own right: a short and specific supervisor brief, a small number of structured moments in the placement, worked examples of useful feedback, and a named contact when a situation exceeds the brief.",ground:"Work-integrated learning (Billett; CEWIL Canada); building design capability in non-designers",link:"lxd",status:"planned",alsoIn:"lsd",added:true,connects:["area_lxd","lx17","lx18","ld23","sd_org"]},
  {id:"lx17",cat:"lxd",depth:3,name:"Placement Quality as a Design Variable",sub:"What distinguishes a strong placement from a filled one",body:"Placement quality can be specified rather than hoped for: identified learning outcomes, graduated responsibility, scheduled feedback, exposure to more than one task, and a documented review at the midpoint while the term can still be adjusted. Making these explicit at the point of agreement gives every party the same expectations and gives the institution something to review against.",ground:"Work-integrated learning quality principles (CEWIL Canada); Billett; constructive alignment (Biggs)",link:"lxd",status:"planned",added:true,connects:["area_lxd","lx16","lx18","ld13","ld29"]},
  {id:"lx18",cat:"lxd",depth:3,name:"Who Is Able to Take the Placement",sub:"Unpaid and unfunded experience as an access question",body:"Where placement is required for a credential and unpaid or unfunded, participation depends on financial circumstance, caregiving, transport and immigration status as much as on capability. Paid and funded placements, part-time and local options, remote arrangements and clear accommodation routes widen who can complete the requirement, and tracking who withdraws makes the pattern visible.",ground:"Unpaid internships and access (Perlin); placement access (Meeks & Jain); equity-centred design",link:"lxd",status:"planned",added:true,connects:["area_lxd","lx17","ac14","ud8","lx13"]},
  {id:"sd10",cat:"lsd",depth:3,name:"Reading Demand as Diagnosis",sub:"What a long queue of requests describes",body:"A large and persistent volume of learning requests carries information beyond workload. Grouping incoming requests by the underlying situation \u2014 rather than by requester or date \u2014 surfaces the recurring conditions that people are asking learning to address, and often identifies a small number of structural changes that would reduce demand at its source.",ground:"Performance analysis (Gilbert; Mager & Pipe); organizational systems (Rummler & Brache); organizational learning (Senge)",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd1","ld1","sd11","sd_org"]},
  {id:"sd11",cat:"lsd",depth:3,name:"Triage When Demand Exceeds Capacity",sub:"A published rule, applied consistently",body:"Where requests will always outnumber capacity, a written and shared allocation rule serves everyone better than sequence of arrival. Tiers of service \u2014 full design, consultation, template and self-serve \u2014 with stated criteria and expected timelines let requesters plan, make the reasoning reviewable, and give the team a defensible basis for what it takes on.",ground:"Prioritization and portfolio management; exploration and exploitation (March); service tiering",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd10","sd12","ev2","ld31","ac10"]},
  {id:"sd12",cat:"lsd",depth:2,name:"The Intake Question as a Governance Instrument",sub:"What is asked at request time shapes what gets built",body:"The intake form is the first design decision in every project. Asking for the situation being addressed, who is affected, what has already been tried, who owns the content afterward and how success will be recognised moves the diagnostic conversation to the start, and gives the requester a clearer sense of what the work involves.",ground:"Needs assessment (Rossett); scoping and staged decision-making; performance analysis",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd11","ld1","ld2","ld4"]},
  {id:"sd13",cat:"lsd",depth:3,name:"Where Authority over Learning Sits",sub:"Who decides, who advises, and who signs",body:"Institutions locate curriculum authority differently \u2014 in faculty governance, in a professional regulator, in an executive, or in the people delivering the work. Mapping where each decision is actually made, and what a designer can settle, recommend or escalate, allows the work to move without depending on informal influence, and makes handover to a successor straightforward.",ground:"Curriculum governance; organizational learning (Senge); accreditation and approval processes",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd_org","ld17","ld33","sd12"]},
  {id:"sd14",cat:"lsd",depth:2,name:"A Risk Register for Knowledge-Building Institutions",sub:"Conditions to monitor, with indicators attached",body:"Institutions whose purpose is producing and holding knowledge carry a distinct set of risks: unverified material entering the evidence base, expertise held only in short-term roles, dependence on a single platform or vendor, decay of source records, and funding cycles shorter than the work. Recording these as a register with named indicators and review points allows them to be monitored, in the same way any other institutional risk is.",ground:"Organizational learning (Senge); complexity and sense-making (Snowden); source and citation integrity",link:"lsd",status:"planned",added:true,connects:["area_lsd","ld15","ld16","ld22","ld7","ep3"]},
  {id:"sd15",cat:"lsd",depth:4,name:"Learning Where Being Wrong Injures Someone",sub:"The cluster anchor \u00b7 design under physical consequence",body:"In laboratories, workshops, clinical settings, transport and utilities, the cost of an error is borne by a person. Design in these settings works to a different standard: performance demonstrated under realistic conditions rather than knowledge recalled, verification before independent work, and content maintained against the procedure it describes.",ground:"Organizational accidents (Reason); high-reliability organizing (Weick & Sutcliffe); Safety-I and Safety-II (Hollnagel, Wears & Braithwaite)",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd16","sd17","sd18","sd19","ac14"]},
  {id:"sd16",cat:"lsd",depth:4,name:"Competency Verification Before Authorization",sub:"The sign-off that permits independent work",body:"Authorization to operate equipment, handle material or work unsupervised rests on demonstrated performance, assessed against stated criteria by a named assessor and recorded with a review date. It differs from graded assessment in purpose and in consequence, and the design questions are what counts as sufficient evidence, who is qualified to judge it, and how currency is maintained.",ground:"Cognitive task analysis (Clark et al.); competency assessment; performance under realistic conditions",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd15","lx11","ld29","ld13","ac14"]},
  {id:"sd17",cat:"lsd",depth:4,name:"Procedural Drift and What It Calls For",sub:"When practice and procedure separate over time",body:"Practice gradually adapts to conditions the written procedure does not describe, and the adaptation usually succeeds until circumstances change. The documented response is to examine the conditions that made the adaptation reasonable \u2014 time pressure, tooling, staffing, a procedure that no longer fits the work \u2014 and to revise the procedure or the conditions, with instruction addressing what remains.",ground:"Normalization of deviance (Vaughan); organizational accidents (Reason); understanding human error (Dekker)",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd15","sd19","ld16","ld1"]},
  {id:"sd18",cat:"lsd",depth:4,name:"Designing for Error Tolerance",sub:"Support at the point of action, not recall under pressure",body:"Where consequence is high, the reliable designs reduce what has to be remembered: checklists, forcing functions, sequenced prompts, clear labelling and equipment that resists being assembled incorrectly. Instruction then covers what these cannot \u2014 judgement, recognition of the unfamiliar, and the decision to stop \u2014 which is a smaller and more teachable set.",ground:"Human error models (Reason); checklists (Gawande); job aids (Rossett & Schafer); design affordances (Norman)",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd15","ld26","sd16","ld9"]},
  {id:"sd19",cat:"lsd",depth:3,name:"Incidents and Near-Misses as Design Inputs",sub:"What the record already contains",body:"Incident reports, near-miss logs and safety reviews are among the most specific accounts an organization holds of where practice meets difficulty. Reading them as design evidence identifies which situations recur and which supports would help, and the value of the record depends on reporting being straightforward and being seen to lead to change.",ground:"Safety culture and reporting (Reason); high-reliability organizing (Weick & Sutcliffe); Safety-II",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd15","sd17","sd10","ev0"]},
  {id:"sd20",cat:"lsd",depth:3,name:"Teaching Technical Experts in Regulated Environments",sub:"Specialist knowledge, a regulator, and a shared record",body:"Research facilities, utilities and clinical services combine deep specialist expertise with external oversight and a training record that must satisfy a reviewer. The craft is drawing out what an expert knows procedurally, keeping the material accurate as procedures are revised, and producing evidence that is genuinely useful to the people doing the work as well as complete for audit.",ground:"Cognitive task analysis (Clark et al.); working with subject-matter experts; regulatory training records",link:"lsd",status:"planned",added:true,connects:["area_lsd","sd15","ld3","ld17","ld33"]},
  {id:"ld34",cat:"trunk",ring:2,depth:3,name:"Participation Without Required Disclosure",sub:"Taking part without having to account for oneself",body:"Activities that ask participants to draw on personal experience place an uneven cost on the people with the most at stake. Offering worked examples, composite cases and observed scenarios as full alternatives, and setting depth of contribution as the participant's choice, keeps the learning available to everyone present without anyone being asked to supply the material.",ground:"Trauma-informed educational practice (Carello & Butler); SAMHSA framework; stigma and disclosure (Goffman)",link:"trunk",status:"planned",added:true,connects:["ac8","ld19","ld35","hr3"]},
  {id:"ld35",cat:"trunk",ring:2,depth:3,name:"Supporting a Participant in Difficulty",sub:"What the facilitator does, and where the role ends",body:"A facilitator's responsibilities are noticing, adjusting pace, offering a break that anyone may take without explanation, and providing accurate information about the support available. Referral to qualified support is part of the role; assessment and care are not, and knowing exactly where that line falls is what allows a facilitator to respond promptly and well.",ground:"Trauma-informed educational practice (Carello & Butler); SAMHSA framework; facilitation practice",link:"trunk",status:"planned",added:true,connects:["ld21","ld34","ld36","ld37"]},
  {id:"ld36",cat:"trunk",ring:2,depth:3,name:"Describing Practice Within the Designation Held",sub:"Claiming the training one has, precisely",body:"Terms drawn from clinical and therapeutic practice describe regulated competencies, and using them to describe learning design invites reliance the role cannot support. Naming the actual qualification, describing the design commitments concretely rather than by label, and citing the framework being applied gives participants an accurate basis for the trust they extend.",ground:"Teaching trauma and trauma-informed teaching distinguished (Carello & Butler); scope of practice; professional designations",link:"trunk",status:"planned",added:true,connects:["ld35","ld15","ld24","ld19"]},
  {id:"ld37",cat:"trunk",ring:2,depth:2,name:"Sustaining the People Who Deliver Demanding Content",sub:"A scheduling and staffing decision",body:"Facilitators and designers who work repeatedly with accounts of harm carry a documented cumulative load. The effective responses are structural: rotation across a roster, limits on consecutive sessions, co-facilitation, scheduled debriefs, and access to support arranged before a programme begins rather than after a difficult session.",ground:"Compassion fatigue and secondary traumatic stress (Figley); vicarious exposure in practice; psychological safety (Edmondson)",link:"trunk",status:"planned",added:true,connects:["ld35","ld21","ld22","sd8"]},
  {id:"km11",cat:"kmb",depth:2,name:"Arts-Based Knowledge Products",sub:"Creative form as a route for evidence",body:"Exhibitions, performance, illustration, film and printed objects reach audiences that reports do not, and can hold complexity that a summary compresses. Designing them as knowledge products means keeping the underlying evidence traceable, stating what the work does and does not claim, and evaluating reach and use as with any other output.",ground:"Arts-based research practice (Leavy); arts and health evidence (Fancourt & Finn); knowledge product design",link:"kmb",status:"planned",added:true,connects:["area_kmb","km4","ld9","pl2","km5"]},
  {id:"km12",cat:"kmb",depth:2,name:"Creative Practice as Inquiry with Knowledge Users",sub:"Making together as a method of finding out",body:"Structured making \u2014 mapping, model-building, drawing, object work \u2014 allows groups to express understanding that interviews reach less readily, and gives participants a shared artefact to reason from. Used within co-production it produces analysable material alongside the relationship, provided consent, authorship and the destination of the work are settled in advance.",ground:"Arts-based research (Leavy); participatory design (Ehn); integrated knowledge translation; research ethics (TCPS 2)",link:"kmb",status:"planned",added:true,connects:["area_kmb","km5","lx14","ep5","ld19"]}
];

/* Similarity: shared theory (sources) + shared themes (tags) + an explicit
   editorial link + a small same-area affinity. Drives both the affinity
   layout and the "most related" ranking. */
function jaccard(A,B){
  if(!A.length || !B.length) return 0;
  const s = new Set(A); let inter=0;
  B.forEach(x => { if(s.has(x)) inter++; });
  return inter/(A.length + B.length - inter);
}
function shared(A,B){ const s=new Set(A); return B.filter(x=>s.has(x)); }
function similarity(a,b){
  const ss = jaccard(a.src, b.src);
  const st = jaccard(a.tags, b.tags);
  const con = (a.connects.includes(b.id) || b.connects.includes(a.id)) ? 1 : 0;
  const area = a.cat===b.cat ? 1 : 0;
  return 0.42*ss + 0.30*st + 0.20*con + 0.08*area;
}

const usedKeys = [];
/* Two passes: the contributions present before the later additions are numbered
   first, so every reference number already cited on a published page keeps its
   value; the later additions then append after them. */
[false, true].forEach(isAdded => {
  CAT_ORDER_BIB.forEach(c => {
    NODES.filter(n => n.cat===c && Boolean(n.added)===isAdded)
         .forEach(n => n.src.forEach(k => { if(!usedKeys.includes(k)) usedKeys.push(k); }));
  });
});
const srcNum = {};
usedKeys.forEach((k,i) => srcNum[k] = i+1);

/* Cross-listed contributions are marked in the data above with an
   "alsoIn" field naming the second area they belong to. They are drawn

/* ============================================================
   Which area is this instance showing?
   ============================================================ */
const AREA = (function(){
  const q = (new URLSearchParams(location.search).get("area")
             || location.hash.replace("#","") || TRUNK).toLowerCase().trim();
  const alias = {"learning-design":TRUNK, "learning-design-craft":TRUNK, foundation:TRUNK,
                 ux:"lxd","learning-experience-design":"lxd","systems":"lsd",
                 "learning-systems-design":"lsd","knowledge-mobilization":"kmb",
                 "universal-design-for-learning":"udl","accessibility":"access",
                 "epistemology":"epist","evaluation":"eval",
                 "public-learning":"public","free-choice":"public",
                 "human-rights-education":"hr","human-rights":"hr","rights":"hr"};
  const key = alias[q] || q;
  // an unrecognised value falls back to the trunk, which is the whole practice
  return (CATS[key] && key !== "core") ? key : TRUNK;
})();

/* The word used for this view in the interface. The nine are branches; the
   trunk is not one of them, and calling it an area would misdescribe it. */
const UNIT = (AREA === TRUNK) ? "the trunk" : "this branch";

/* The trunk's hub node. The nine branches each have one in the data block
   (area_lxd, area_udl, and so on); the trunk does not, because on the full
   landscape it is the centre rather than a branch beside them. It is built
   here so this map has something to ring its contributions around, using the
   same wording as landscape-linear.html. */
if(AREA === TRUNK && !nodeMap.area_trunk){
  const hub = {
    id:"area_trunk", cat:TRUNK, depth:4, name:"Learning Design",
    sub:"The foundation \u00b7 shared craft, process, and evidence discipline",
    body:"The shared craft of learning design, which every branch grows from and none of them owns. It runs from the first diagnostic question \u2014 whether this is a learning problem at all \u2014 through scoping, working with experts, writing, visual language and production, and out to the practices the field holds in common: quality assurance, source discipline, privacy, ethics, update cycles, and the case made for the resource in the first place.",
    ground:"Performance analysis; adult learning; learning sciences; plain language and accessibility standards; research and privacy ethics",
    link:TRUNK, connects:[], src:[], tags:["craft","process","evidence"]
  };
  NODES.push(hub); nodeMap[hub.id] = hub;
}

function boot(){
  const areaNode = nodeMap["area_"+AREA];
  const own = NODES.filter(n => n.cat===AREA && n.id!==areaNode.id);
  const guests = NODES.filter(n => n.alsoIn === AREA);
  const items = own.concat(guests);
  const shown = [areaNode].concat(items);
  const isGuest = id => guests.some(g => g.id===id);
  const shownIds = new Set(shown.map(n => n.id));
  const colour = CATS[AREA].color;

  document.title = CATS[AREA].label + " · Learning Design Landscape";
  document.getElementById("area-label").textContent = CATS[AREA].label;
  document.getElementById("area-sw").style.background = colour;
  document.getElementById("fullmap").href =
    "https://accessiblelearninglabs.github.io/learning-design-specialization/landscape.html";
  // the linear counterpart of this area, for screen reader and keyboard use
  (function linearLink(){
    const a = document.getElementById("linear");
    a.href = "area-map-"+AREA+"-linear.html";
    a.setAttribute("aria-label",
      "Text version of the "+CATS[AREA].label+" map, optimised for screen readers and keyboards. Opens in a new tab.");
  })();

  // if any resource here is cross-listed, say so in the footer
  (function guestLegend(){
    if(!guests.length) return;
    const homes = [];
    guests.forEach(n => { if(homes.indexOf(n.cat) === -1) homes.push(n.cat); });
    homes.forEach(cat => {
      const el = document.createElement("span");
      el.className = "li";
      el.innerHTML = '<span class="sz" style="width:10px;height:10px;background:'+
        CATS[cat].color+'"></span>Also a '+CATS[cat].label+' resource';
      document.querySelector(".foot").insertBefore(el, document.getElementById("foot-hint"));
    });
  })();

  /* ── text alternative: a real, linked list for screen readers ── */
  (function textAlt(){
    const box = document.getElementById("textalt");
    let html = '<h2>'+CATS[AREA].label+' — contributions in '+UNIT+'</h2><ul>';
    items.forEach(n => {
      const page = PAGES[n.id] || null;
      html += '<li>'+(page ? '<a href="'+page+'" target="_blank" rel="noopener">'+n.name+'</a>' : n.name)+
              ' — '+n.body+' '+(page ? '(Published resource.)'
                : ((n.status && n.status !== "built" ? STATUS[n.status] : STATUS.dev)+
                   '; live page coming soon.'))+'</li>';
    });
    html += '</ul>';
    box.innerHTML = html;
    document.getElementById("map").setAttribute("aria-label",
      "Map of the "+items.length+" contributions in "+CATS[AREA].label+
      ". Interactive: use the arrow keys to move between contributions and Enter to read one. "+
      "A text list of every contribution follows.");
  })();

  /* ============================================================
     Layout — the area sits at the centre, its contributions ring it
     ============================================================ */
  areaNode.px = 0; areaNode.py = 0;
  const N = items.length;
  items.forEach((n,i) => {
    const a = -Math.PI/2 + i*(Math.PI*2/N);
    // the ring grows a little once an area carries more than ~16 contributions,
    // so nodes stay comfortably apart; smaller areas keep their existing spacing
    const r = Math.max(112, N*7) + (i%2 ? 34 : 0);
    n.px = Math.cos(a)*r; n.py = Math.sin(a)*r; n.ang = a;
  });
  const depthR = {1:5,2:6.5,3:8.5,4:12,5:15};
  const MAXR = Math.max.apply(null, shown.map(n => Math.hypot(n.px,n.py))) || 1;

  /* ============================================================
     Canvas engine
     ============================================================ */
  const wrap = document.getElementById("cwrap");
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const tt = document.getElementById("tt");

  let selected = areaNode.id, hovered = null, inited = false;
  let fitZoom=1, zoom=1, targetZoom=1;
  let panX=0, panY=0, targetPanX=0, targetPanY=0;
  let W=0,H=0,DPR=1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = Math.max(1,W*DPR); canvas.height = Math.max(1,H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    // leave room for the radial labels either side, and for two-line labels top and bottom
    const zx = (W*0.5 - 150)/MAXR, zy = (H*0.5 - 52)/MAXR;
    fitZoom = Math.max(0.34, Math.min(1.25, Math.min(zx,zy)));
    if(!inited){ zoom = targetZoom = fitZoom; inited = true; }
  }
  window.addEventListener("resize", resize);

  function roomForLabels(){ return W >= 560 && H >= 300; }
  function project(n){ return {sx: W/2 + (n.px+panX)*zoom, sy: H/2 + (n.py+panY)*zoom}; }
  function nodeRadius(n){ return Math.max(2, depthR[n.depth]*zoom); }

  function hexA(hex,a){ const c=hx(hex); return "rgba("+c[0]+","+c[1]+","+c[2]+","+a.toFixed(3)+")"; }
  function shade(hex,d){ const c=hx(hex); return "#"+c.map(v=>clamp(v+d).toString(16).padStart(2,"0")).join(""); }
  function hx(hex){ hex=hex.replace("#",""); return [0,2,4].map(i=>parseInt(hex.substr(i,2),16)); }
  function clamp(v){ return Math.max(0,Math.min(255,v)); }

  /* wrap a name onto at most two lines for the radial labels */
  const wrapCache = {};
  function wrapLabel(name){
    if(wrapCache[name]) return wrapCache[name];
    const words = name.split(" ");
    let l1 = "", l2 = "";
    words.forEach(w => {
      if(!l2 && (l1+" "+w).trim().length <= 19) l1 = (l1+" "+w).trim();
      else l2 = (l2+" "+w).trim();
    });
    if(l2.length > 22) l2 = l2.slice(0,21).trim()+"\u2026";
    const out = l2 ? [l1,l2] : [l1];
    wrapCache[name] = out; return out;
  }

  let lastPts = [];
  /* Radial labels, with a vertical de-collision pass on each side. Contributions
     keep their side of the ring; labels slide vertically only as far as they must
     to stop overlapping, then are clamped inside the frame. */
  const labelAlpha = {};
  function labelBoxes(pMap){
    const sides = {L:[], R:[]};
    items.forEach(n => {
      const p = pMap[n.id], r = nodeRadius(n), lines = wrapLabel(n.name);
      const side = Math.cos(n.ang) >= 0 ? "R" : "L";
      sides[side].push({n, side, lines,
        x: side==="R" ? p.sx + r + 7 : p.sx - r - 7,
        cy0: p.sy, cy: p.sy, h: lines.length*12});
    });
    const GAP = 4;
    ["L","R"].forEach(k => {
      const g = sides[k].sort((a,b) => a.cy0 - b.cy0);
      // push down through the list
      for(let i=1;i<g.length;i++){
        const min = g[i-1].cy + g[i-1].h/2 + GAP + g[i].h/2;
        if(g[i].cy < min) g[i].cy = min;
      }
      // then pull back up so nothing leaves the frame
      for(let i=g.length-1;i>=0;i--){
        const max = (i===g.length-1) ? H - 8 - g[i].h/2
                                     : g[i+1].cy - g[i+1].h/2 - GAP - g[i].h/2;
        if(g[i].cy > max) g[i].cy = max;
      }
      for(let i=0;i<g.length;i++){
        const min = (i===0) ? 8 + g[i].h/2
                            : g[i-1].cy + g[i-1].h/2 + GAP + g[i].h/2;
        if(g[i].cy < min) g[i].cy = min;
      }
    });
    return sides.L.concat(sides.R);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const pMap = {}; shown.forEach(n => pMap[n.id] = project(n));
    const focus = selected || hovered;

    // spokes from the area to each contribution
    const cp = pMap[areaNode.id];
    ctx.lineWidth = 1;
    items.forEach(n => {
      const p = pMap[n.id];
      const touch = focus && (focus===n.id || focus===areaNode.id);
      ctx.strokeStyle = "rgba(48,62,68,"+(touch ? 0.34 : (focus ? 0.07 : 0.14))+")";
      ctx.beginPath(); ctx.moveTo(cp.sx,cp.sy); ctx.lineTo(p.sx,p.sy); ctx.stroke();
    });

    // editorial links between contributions inside this area
    const seen = new Set();
    items.forEach(n => {
      (n.connects||[]).forEach(cid => {
        if(!shownIds.has(cid) || cid===areaNode.id) return;
        const key = [n.id,cid].sort().join("-");
        if(seen.has(key)) return; seen.add(key);
        const a = pMap[n.id], b = pMap[cid];
        const touch = focus && (focus===n.id || focus===cid);
        ctx.lineWidth = touch ? 1.4 : 1;
        ctx.strokeStyle = hexA(colour, touch ? 0.55 : (focus ? 0.12 : 0.3));
        ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
      });
    });

    // nodes and their labels
    shown.forEach(n => {
      const p = pMap[n.id], r = nodeRadius(n);
      const isArea = n.id===areaNode.id;
      const col = isArea ? "#303e44" : CATS[n.cat].color;
      let alpha = 0.95;
      if(selected){
        if(n.id===selected) alpha = 1;
        else if(isArea || (nodeMap[selected].connects||[]).includes(n.id) ||
                (n.connects||[]).includes(selected)) alpha = 0.9;
        else alpha = 0.4;
      } else if(hovered){ alpha = (n.id===hovered) ? 1 : 0.55; }

      const g = ctx.createRadialGradient(p.sx,p.sy,0,p.sx,p.sy,r*2.1);
      g.addColorStop(0, hexA(col, 0.16*alpha));
      g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r*2.1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = hexA(col, alpha);
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,Math.PI*2); ctx.fill();
      ctx.lineWidth = (n.id===selected||n.id===hovered) ? 1.6 : 1;
      ctx.strokeStyle = hexA(shade(col,-22), alpha);
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,Math.PI*2); ctx.stroke();

      // the area label sits above the centre; contribution labels are laid out below
      const on = (n.id===selected || n.id===hovered);
      if(isArea){
        ctx.fillStyle = "rgba(48,62,68,"+(on ? 0.95 : 0.9).toFixed(2)+")";
        ctx.font = "600 12px Asap, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.fillText(n.name, p.sx, p.sy - r - 7);
      }
      labelAlpha[n.id] = alpha;
    });

    // contribution labels, de-collided so any number of resources stays legible
    if(roomForLabels()){
      labelBoxes(pMap).forEach(o => {
        const on = (o.n.id===selected || o.n.id===hovered);
        ctx.fillStyle = "rgba(48,62,68,"+(on ? 0.95 : (0.3 + 0.42*(labelAlpha[o.n.id]||1))).toFixed(2)+")";
        ctx.font = (on ? "600 " : "500 ") + "10.5px Asap, sans-serif";
        ctx.textAlign = o.side==="R" ? "left" : "right";
        ctx.textBaseline = "middle";
        const top = o.cy - (o.lines.length-1)*6;
        o.lines.forEach((ln,i) => ctx.fillText(ln, o.x, top + i*12));
      });
    } else {
      // narrow embed: label only the active node
      const id = hovered || selected;
      const n = id && nodeMap[id];
      if(n && id !== areaNode.id && shownIds.has(id)){
        const p = pMap[id], r = nodeRadius(n), lines = wrapLabel(n.name);
        ctx.fillStyle = "rgba(48,62,68,0.95)";
        ctx.font = "600 10.5px Asap, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const y = p.sy + r + 12;
        lines.forEach((ln,i) => ctx.fillText(ln, p.sx, y + i*12));
      }
    }

    lastPts = shown.map(n => { const p = pMap[n.id]; return {id:n.id, x:p.sx, y:p.sy, r:nodeRadius(n)}; });
  }

  function hitTest(mx,my){
    let best=null, bd=1e9;
    for(let i=lastPts.length-1;i>=0;i--){
      const p=lastPts[i], d=Math.hypot(mx-p.x,my-p.y);
      if(d <= p.r+7 && d<bd){ bd=d; best=p.id; }
    }
    return best;
  }

  function tick(){
    zoom += (targetZoom-zoom)*0.16;
    panX += (targetPanX-panX)*0.16;
    panY += (targetPanY-panY)*0.16;
    draw();
    requestAnimationFrame(tick);
  }

  /* ── pointer ── */
  let dragging=false, moved=0, last={x:0,y:0};
  function localXY(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x:cx, y:cy};
  }
  function onDown(e){ const p=localXY(e); dragging=true; moved=0; last=p; canvas.classList.add("grabbing"); }
  function onMove(e){
    const p = localXY(e);
    if(dragging){
      const dx=p.x-last.x, dy=p.y-last.y; moved += Math.abs(dx)+Math.abs(dy); last=p;
      targetPanX += dx/zoom; targetPanY += dy/zoom; panX=targetPanX; panY=targetPanY;
      tt.classList.remove("show");
      return;
    }
    const id = hitTest(p.x,p.y);
    if(id !== hovered) hovered = id;
    if(id){
      const n = nodeMap[id];
      document.getElementById("tt-k").textContent = (id===areaNode.id) ? "Area" : CATS[n.cat].label;
      document.getElementById("tt-n").textContent = n.name;
      tt.style.left = (p.x+14)+"px"; tt.style.top = (p.y-6)+"px";
      tt.classList.add("show"); canvas.classList.add("pointing");
    } else { tt.classList.remove("show"); canvas.classList.remove("pointing"); }
  }
  function onUp(e){
    canvas.classList.remove("grabbing");
    if(dragging && moved < 5){
      const r = canvas.getBoundingClientRect();
      const p = e.changedTouches
        ? {x:e.changedTouches[0].clientX-r.left, y:e.changedTouches[0].clientY-r.top}
        : last;
      const id = hitTest(p.x,p.y);
      if(id) openPanel(id);
    }
    dragging = false;
  }
  canvas.addEventListener("mousedown",onDown);
  window.addEventListener("mousemove",onMove);
  window.addEventListener("mouseup",onUp);
  canvas.addEventListener("mouseleave",()=>{ hovered=null; tt.classList.remove("show"); });

  /* Touch: one finger scrolls the host page (or taps a node); two fingers
     pan and pinch the map. This keeps the embed from trapping the scroll. */
  let touchMode = 0, tStart = null, pinchD = 0, pinchZoom = 1;
  function touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
  function touchMid(t){
    const r = canvas.getBoundingClientRect();
    return {x:(t[0].clientX+t[1].clientX)/2 - r.left, y:(t[0].clientY+t[1].clientY)/2 - r.top};
  }
  canvas.addEventListener("touchstart", e => {
    touchMode = e.touches.length;
    if(touchMode === 1){ tStart = localXY(e); }
    else if(touchMode >= 2){
      pinchD = touchDist(e.touches); pinchZoom = targetZoom; last = touchMid(e.touches);
    }
  }, {passive:true});
  canvas.addEventListener("touchmove", e => {
    if(e.touches.length >= 2){
      e.preventDefault();                       // two fingers: the map takes over
      const d = touchDist(e.touches);
      if(pinchD > 0){
        targetZoom = Math.max(0.3, Math.min(3, pinchZoom * (d/pinchD)));
        zoom = targetZoom;
      }
      const m = touchMid(e.touches);
      targetPanX += (m.x-last.x)/zoom; targetPanY += (m.y-last.y)/zoom;
      panX = targetPanX; panY = targetPanY; last = m;
    }
    // one finger: do nothing, so the page scrolls normally
  }, {passive:false});
  canvas.addEventListener("touchend", e => {
    if(touchMode === 1 && tStart && e.changedTouches.length){
      const r = canvas.getBoundingClientRect();
      const p = {x:e.changedTouches[0].clientX-r.left, y:e.changedTouches[0].clientY-r.top};
      if(Math.hypot(p.x-tStart.x, p.y-tStart.y) < 12){
        const id = hitTest(p.x,p.y);
        if(id) openPanel(id);
      }
    }
    touchMode = 0; tStart = null; pinchD = 0;
  });

  /* Wheel: zoom only when a modifier is held, so plain scrolling passes
     through to the page the map is embedded in. */
  canvas.addEventListener("wheel", e => {
    if(!(e.ctrlKey || e.metaKey)) return;        // let the page scroll
    e.preventDefault();
    targetZoom *= e.deltaY>0 ? 0.9 : 1.1;
    targetZoom = Math.max(0.3, Math.min(3, targetZoom));
  }, {passive:false});

  /* ── keyboard: arrow keys walk the ring, Enter reads, Escape returns ── */
  canvas.addEventListener("keydown", e => {
    const order = shown.map(n => n.id);
    let i = order.indexOf(selected);
    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      i = (i+1) % order.length; openPanel(order[i]); e.preventDefault();
    } else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      i = (i-1+order.length) % order.length; openPanel(order[i]); e.preventDefault();
    } else if(e.key === "Home"){ openPanel(areaNode.id); e.preventDefault(); }
    else if(e.key === "Escape"){ openPanel(areaNode.id); resetView(); e.preventDefault(); }
  });

  /* ============================================================
     Panel
     ============================================================ */
  function openPanel(id){
    selected = id;
    const n = nodeMap[id];
    const isArea = (id === areaNode.id);
    const page = PAGES[n.id] || null;
    const live = !!page;
    // PAGES decides whether a live page exists; the node's own status supplies the
    // wording when it does not, so a planned contribution is not called in development
    const st = isArea ? ""
      : live ? (n.status === "service" ? STATUS.service : STATUS.built)
             : (n.status && n.status !== "built" ? STATUS[n.status] : STATUS.dev);

    const srcHtml = (n.src||[]).map(k => {
      const s = SOURCES[k], num = srcNum[k]; if(!s) return "";
      const txt = "["+num+"] "+s.t;
      return "<li>"+(s.u ? '<a href="'+s.u+'" target="_blank" rel="noopener">'+txt+'</a>' : txt)+"</li>";
    }).filter(Boolean).join("");

    // links inside this area are clickable; links beyond it point to the other area page
    const inArea = [], beyond = [];
    (n.connects||[]).forEach(cid => {
      const cn = nodeMap[cid]; if(!cn) return;
      if(shownIds.has(cid)){
        if(cid !== id) inArea.push('<button class="chip" data-go="'+cid+'"><span class="cd" style="--sw:'+
          (cid===areaNode.id ? "#303e44" : CATS[cn.cat].color)+'"></span>'+cn.name+'</button>');
      } else if(cn.cat !== "core"){
        beyond.push('<a class="chip" href="'+(LINKS[cn.cat]||"#")+'" target="_blank" rel="noopener">'+
          '<span class="cd" style="--sw:'+CATS[cn.cat].color+'"></span>'+cn.name+'</a>');
      }
    });

    // most related within this area, by shared theory and theme
    let relHtml = "";
    if(!isArea){
      const rel = items.filter(m => m.id !== id)
        .map(m => ({m, s:similarity(n,m)}))
        .filter(o => o.s > 0.12)
        .sort((a,b) => b.s - a.s).slice(0,3);
      relHtml = rel.map(({m}) => {
        const shTags = shared(n.tags, m.tags).map(t => TAG_LABELS[t]||t);
        const shSrc = shared(n.src, m.src).length;
        const basis = [];
        if(shTags.length) basis.push(shTags.join(", "));
        if(shSrc) basis.push(shSrc+" shared source"+(shSrc>1?"s":""));
        return '<button class="rel" data-go="'+m.id+'">'+
          '<span class="rel-bar" style="--rc:'+CATS[m.cat].color+'"></span>'+
          '<span class="rel-txt"><span class="rel-name">'+m.name+'</span>'+
          (basis.length ? '<span class="rel-basis">'+basis.join(" \u00b7 ")+'</span>' : '')+
          '</span></button>';
      }).join("");
    }

    const panel = document.getElementById("panel");
    panel.innerHTML =
      '<div class="p-tag" style="color:'+(isArea ? "#303e44" : CATS[n.cat].color)+'">'+
        (isArea ? (AREA===TRUNK ? "The trunk" : "This branch") : CATS[n.cat].label)+'</div>'+
      '<h3 class="p-title">'+n.name+'</h3>'+
      '<p class="p-sub">'+n.sub+'</p>'+
      (st ? '<p class="p-status">'+st+'</p>' : '')+
      '<p class="p-body">'+n.body+'</p>'+
      (isGuest(id) ? '<p class="p-note">A resource in both branches. Its home is '+
        CATS[n.cat].label+', and it is also part of the '+CATS[AREA].label+' set.</p>' : '')+
      (n.ground ? '<p class="p-ground"><span>Grounding.</span> '+n.ground+'</p>' : '')+
      (n.note ? '<p class="p-note">'+n.note+'</p>' : '')+
      (isArea ? '' : (live
        ? '<a class="p-cta" href="'+page+'" target="_blank" rel="noopener">View the live page \u2192</a>'
        : '<span class="p-soon">Live page coming soon</span>'))+
      (srcHtml ? '<div class="p-label">Sources</div><ul class="p-src">'+srcHtml+'</ul>' : '')+
      (relHtml ? '<div class="p-label">Most related here \u00b7 by shared theory &amp; theme</div>'+
                 '<div class="p-rel">'+relHtml+'</div>' : '')+
      (inArea.length ? '<div class="p-label">Connected in '+UNIT+'</div>'+
                       '<div class="p-conns">'+inArea.join("")+'</div>' : '')+
      (beyond.length ? '<div class="p-label">Where this work leads</div>'+
                       '<div class="p-conns">'+beyond.join("")+'</div>' : '');
    panel.querySelectorAll("[data-go]").forEach(b =>
      b.addEventListener("click", () => openPanel(b.dataset.go)));
    panel.scrollTop = 0;
  }

  function resetView(){ targetZoom = fitZoom; targetPanX = 0; targetPanY = 0; }
  document.getElementById("reset").addEventListener("click", () => {
    resetView(); openPanel(areaNode.id);
  });

  resize();
  openPanel(areaNode.id);
  requestAnimationFrame(tick);
}

if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", boot); }
else { boot(); }
</script>
</body>
</html>
