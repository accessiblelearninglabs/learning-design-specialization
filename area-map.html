<style>
  :root{--paper:#ffffff;--ink:#43525a;--ink-strong:#303e44;--stone:#8a959b;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:"Asap",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.55;}

  .embed{display:flex;flex-direction:column;height:100%;min-height:400px;padding:0;}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 0 9px;}
  .areamark{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.15em;
    text-transform:uppercase;font-weight:600;color:var(--ink-strong);}
  .areamark .sw{width:9px;height:9px;border-radius:100px;flex-shrink:0;}
  .barspace{flex:1 1 auto;}
  .linkbtn{font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
    color:var(--stone);background:none;border:none;cursor:pointer;padding:4px 2px;text-decoration:none;
    transition:color .2s var(--ease);}
  .linkbtn:hover,.linkbtn:focus-visible{color:var(--ink-strong);}

  .stage{flex:1 1 auto;display:grid;grid-template-columns:1fr 252px;gap:1px;background:var(--hair);
    border:1px solid var(--hair);border-radius:6px;overflow:hidden;min-height:0;}
  .canvas-wrap{position:relative;background:var(--paper);min-height:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;cursor:grab;outline:none;}
  canvas.grabbing{cursor:grabbing;}
  canvas.pointing{cursor:pointer;}
  canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

  .tt{position:absolute;pointer-events:none;z-index:5;background:var(--ink-strong);color:#fff;
    border-radius:4px;padding:5px 8px;max-width:190px;opacity:0;transform:translateY(2px);
    transition:opacity .14s var(--ease);}
  .tt.show{opacity:1;}
  .tt .k{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:2px;}
  .tt .n{font-size:12px;line-height:1.3;}

  .panel{background:var(--panel);padding:16px 16px 20px;overflow-y:auto;min-height:0;}
  .p-tag{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin:0 0 6px;}
  .p-title{font-size:16px;font-weight:500;color:var(--ink-strong);line-height:1.2;margin:0 0 3px;letter-spacing:-.01em;}
  .p-sub{font-size:11.5px;color:var(--stone);margin:0 0 4px;}
  .p-status{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);margin:0 0 11px;}
  .p-body{font-size:12.5px;color:var(--ink);margin:0;}
  .p-ground{font-size:11.5px;color:var(--stone);margin:10px 0 0;}
  .p-ground span{color:var(--ink-strong);font-weight:600;}
  .p-note{font-size:11.5px;color:var(--stone);font-style:italic;margin:9px 0 0;}
  .p-cta{display:inline-block;margin:14px 0 0;font-size:11px;letter-spacing:.05em;font-weight:600;
    color:var(--accent);text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:2px;
    transition:border-color .2s var(--ease);}
  .p-cta:hover,.p-cta:focus-visible{border-color:var(--accent);}
  .p-soon{display:inline-block;margin:14px 0 0;font-size:11px;letter-spacing:.05em;font-weight:600;
    color:var(--stone);border-bottom:1px solid var(--hair-soft);padding-bottom:2px;}
  .p-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);font-weight:600;
    margin:16px 0 7px;padding-top:12px;border-top:1px solid var(--hair);}
  .p-src{list-style:none;margin:0;padding:0;}
  .p-src li{font-size:10.5px;line-height:1.45;margin-bottom:7px;color:var(--ink);}
  .p-src a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:2px;}
  .p-src a:hover{text-decoration-color:var(--accent);}
  .p-conns{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{font-family:inherit;font-size:10px;letter-spacing:.02em;color:var(--ink);background:var(--paper);
    border:1px solid var(--hair);border-radius:100px;padding:4px 9px;cursor:pointer;text-decoration:none;
    display:inline-block;transition:all .2s var(--ease);}
  .chip:hover,.chip:focus-visible{border-color:var(--stone);color:var(--ink-strong);}
  .chip .cd{display:inline-block;width:6px;height:6px;border-radius:100px;margin-right:5px;vertical-align:middle;
    background:var(--sw,var(--stone));transform:translateY(-1px);}
  .p-rel{display:flex;flex-direction:column;gap:1px;}
  .rel{display:flex;align-items:stretch;gap:8px;font-family:inherit;text-align:left;width:100%;
    background:none;border:none;padding:5px 2px;cursor:pointer;border-radius:3px;transition:background .18s var(--ease);}
  .rel:hover,.rel:focus-visible{background:var(--paper);}
  .rel-bar{flex:0 0 3px;border-radius:3px;background:var(--rc,var(--stone));align-self:stretch;opacity:.85;}
  .rel-txt{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .rel-name{font-size:11.5px;color:var(--ink-strong);font-weight:500;line-height:1.25;}
  .rel-basis{font-size:10px;color:var(--stone);line-height:1.3;}

  .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:9px 2px 0;}
  .foot .li{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--stone);}
  .foot .sz{border-radius:100px;background:var(--stone);flex-shrink:0;}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .sr-only a:focus{position:static;width:auto;height:auto;clip:auto;}

  @media (max-width:720px){
    .stage{grid-template-columns:1fr;grid-template-rows:minmax(230px,1fr) minmax(150px,0.85fr);}
    .panel{border-top:1px solid var(--hair);}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

const NODES = [
  /* ── CENTRE ── */
  {id:"c0",cat:"core",depth:5,name:"Learning Design Specialization",sub:"One practice, mapped as a trunk and nine branches",
   body:"A single practice that designs how people and organizations learn, expressed as a trunk of shared craft and nine connected branches of expertise — each with its own node and its own page. Every contribution below grows on one branch and links to the others it draws on, because the branches are not separate skills but one body of work seen from different perspectives.",
   ground:"Adult learning · learning sciences · human-centred design",link:"lxd",status:"dev",
   connects:["area_lxd","area_udl","area_kmb","area_lsd","area_access","area_epist"]},

  /* ── AREA NODES (each links to its own area page) ── */
  {id:"area_lxd",cat:"lxd",depth:4,name:"Learning Experience Design",sub:"Branch · the learner's lived experience",
   body:"The design of learning as it is actually experienced — how a learner moves through it, engages with it, and makes it their own. This branch gathers the contributions that shape the experience itself, from motivation through practice, reflection, and the journey that holds them together.",
   ground:"Experiential learning; human-centred design",link:"lxd",
   connects:["c0","lx10","lx3","lx4"]},
  {id:"area_udl",cat:"udl",depth:4,name:"Universal Design for Learning",sub:"Branch · designing for the full range of learners",
   body:"Designing proactively for the full, predictable range of human variability, so learning fits diverse learners from the outset rather than being retrofitted. This branch gathers the contributions that reduce barriers and widen access without lowering rigour.",
   ground:"Universal Design for Learning (CAST)",link:"udl",
   connects:["c0","ud1","ud2","ud7"]},
  {id:"area_kmb",cat:"kmb",depth:4,name:"Knowledge Mobilization",sub:"Branch · moving evidence into practice",
   body:"The design of how research and evidence reach the people who can use them, and change what they do. This branch gathers the contributions that turn knowledge into usable, evaluated, and sustained practice across sectors.",
   ground:"Knowledge mobilization; implementation science",link:"kmb",
   connects:["c0","km1","km2","km3"]},
  {id:"area_lsd",cat:"lsd",depth:4,name:"Learning Systems Design",sub:"Branch · learning across a whole organization",
   body:"The design of learning as an organizational system — its analysis, infrastructure, evaluation, and change — rather than as isolated programs. This branch gathers the contributions that situate learning inside institutions and help them move.",
   ground:"Systems thinking; organizational learning",link:"lsd",
   connects:["c0","sd_org","sd_eval","sd1","lx3","lx4","lx6"]},
  {id:"area_access",cat:"access",depth:4,name:"Accessibility",sub:"Branch · access, disability, and accommodation",
   body:"Access understood at the level of the individual person and the obligation an institution holds toward them, alongside the proactive design that reduces how often that obligation must be invoked. This branch gathers knowledge resources written for learning designers, faculty, and institutions, offered in support of — never in place of — the accessibility advisors and accommodation professionals who carry this work day to day.",
   ground:"Human rights and accommodation law; disability studies; accessibility standards; inclusive design",link:"access",
   connects:["c0","ac4","ac5","ac6","ac7"]},
  {id:"area_epist",cat:"epist",depth:4,name:"Epistemology",sub:"Branch · whose knowledge counts, and on what grounds",
   body:"The conditions under which a knowledge claim is admitted, discounted, or never formed at all — the questions that arise before evidence is appraised rather than during it. This branch gathers the contributions that give a design process language for how it decides what will count as knowledge, and for what the exclusions cost. It supplies analysis; the standing commitments owed to communities and to Indigenous knowledge holders remain with the branches and instruments that carry them.",
   ground:"Social epistemology; epistemic injustice; science and technology studies; socio-legal epistemology of evidence",link:"epist",
   connects:["c0","ep0","ep1","ep2"]},

  /* ── LEARNING EXPERIENCE DESIGN ── */
  {id:"lx10",cat:"lxd",depth:3,name:"Learning Experience Architecture",sub:"The five-phase rhythm — Why · See · Try · Share · Reflect",
   body:"The end-to-end arc a learner moves through, designed as one coherent journey rather than a sequence of modules. It is the organizing spine of the experience work, and the frame every other contribution on this branch extends.",
   ground:"Experiential learning (Kolb); the Why→See→Try→Share→Reflect rhythm",link:"lxd",status:"built",
   connects:["c0","lx1","lx3","lx5"]},
  {id:"lx1",cat:"lxd",depth:3,name:"Designing for Motivation & Relevance",sub:"Why adult learners engage — or quietly disengage",
   body:"Anchoring learning to a learner's real circumstances and existing expertise before content is introduced, so relevance and autonomy carry the motivational work. It addresses the most common reason programs fall short: attention and completion that quietly decline.",
   ground:"Self-Determination Theory (Ryan & Deci)",link:"lxd",status:"dev",connects:["lx10","ud3"]},
  {id:"lx2",cat:"lxd",depth:3,name:"Managing Cognitive Load",sub:"Learning that working memory can hold",
   body:"Chunking, sequencing, worked examples, and multimedia principles that keep dense material within the limits of attention and memory. It matters most where content is genuinely complex, as in research and health settings.",
   ground:"Cognitive Load Theory (Sweller); Multimedia Learning (Mayer)",link:"lxd",status:"dev",connects:["lx10","ud5"]},
  {id:"lx3",cat:"lxd",depth:4,name:"Experiential Learning Infrastructure",sub:"Learning by doing, built to last",
   body:"The conditions and structures that let adult learners practise, make consequential mistakes, and build capability through experience rather than exposure. It treats error as a designed source of feedback, not a failure of instruction.",
   ground:"Experiential learning (Kolb); retrieval practice & desirable difficulties (Bjork)",link:"lxd",status:"built",alsoIn:"lsd",connects:["lx10","lx5","ac3","area_lsd"]},
  {id:"lx4",cat:"lxd",depth:4,name:"Learning Community Design & Facilitation",sub:"Peer learning and communities of practice",
   body:"Designing the social layer of learning — structured peer exchange, collaborative sense-making, and communities of practice that let expertise circulate rather than sit in silos. It is also the capability that sustains evidence use in knowledge mobilization.",
   ground:"Zone of proximal development (Vygotsky); communities of practice (Wenger)",link:"lxd",status:"built",alsoIn:"lsd",connects:["lx10","km5","km1","ac3","area_lsd"]},
  {id:"lx5",cat:"lxd",depth:3,name:"Designing for Reflection & Transfer",sub:"Making learning adapt to new situations",
   body:"Reflection and metacognition designed in, so learners can make what they have learned their own and re-deploy it in situations the designer could not anticipate. It is the experience-level form of closing the distance between knowing and doing.",
   ground:"Metacognition (Flavell); reflective practice (Schön); Bransford et al.",link:"lxd",status:"dev",connects:["lx10","ud4","lx3"]},
  {id:"lx6",cat:"lxd",depth:3,name:"Learner Research: Human-Centred Design",sub:"Understanding learners before designing for them",
   body:"UX research applied to learning — interviews, empathy mapping, personas, journey mapping, and synthesis — so programs are grounded in who learners actually are rather than who they are assumed to be. At organizational scale, the same inquiry becomes needs analysis.",
   ground:"Human-centred design; UX research methods",link:"lxd",status:"partial",alsoIn:"lsd",connects:["lx10","sd1","ud1","area_lsd"]},
  {id:"lx7",cat:"lxd",depth:3,name:"Assessment & Feedback as Experience",sub:"Feedback that drives learning, not anxiety",
   body:"Designing assessment and feedback as part of the learning itself — authentic tasks, timely formative feedback, and productive challenge — rather than as a terminal measurement. It works alongside barrier removal, but is a distinct concern.",
   ground:"Authentic assessment (Wiggins & McTighe); feedback research",link:"lxd",status:"dev",connects:["lx10","ud7","ac1"]},
  {id:"lx8",cat:"lxd",depth:3,name:"Backward Design in Practice",sub:"Aligning outcomes, assessment, and activity",
   body:"Holding a single learning experience coherent by starting from the intended outcome, then the evidence of it, then the activity — so nothing in the experience is arbitrary. It answers a recurring need in program and accreditation contexts.",
   ground:"Backward design (Wiggins & McTighe)",link:"lxd",status:"dev",connects:["lx10","ac2","sd6"]},
  {id:"lx9",cat:"lxd",depth:3,name:"Testing & Iterating the Experience",sub:"Usability methods for learning",
   body:"Treating a learning experience as something to be tested with real learners and improved — usability testing, beta cycles, and quality assurance — before and after it is delivered. It is the formative counterpart to downstream impact evaluation.",
   ground:"Usability testing; System Usability Scale",link:"lxd",status:"partial",connects:["lx10","ud10","km2"]},

  /* ── UNIVERSAL DESIGN FOR LEARNING ── */
  {id:"ud1",cat:"udl",depth:3,name:"Designing for Learner Variability at Scale",sub:"The thesis the other UDL work inherits",
   body:"Designing from the outset for the full, predictable range of human variability, so the environment fits diverse learners rather than a mythical average one. It is the worldview that grounds every other contribution on this branch.",
   ground:"Universal Design for Learning (CAST; Rose & Meyer)",link:"udl",status:"built",connects:["c0","ud2","lx6"]},
  {id:"ud2",cat:"udl",depth:3,name:"From Accommodation to Proactive Inclusive Design",sub:"The field's defining reframe",
   body:"Shifting from retrofitting access for individuals after the fact to designing inclusively from the start, so fewer barriers are ever built in. It states the paradigm shift the field rests on, plainly.",
   ground:"Universal Design for Learning; inclusive design principles",link:"udl",status:"built",connects:["ud1","ac1","ac4"]},
  {id:"ud3",cat:"udl",depth:2,name:"Engaging Voluntary & Cautious Adult Learners",sub:"The engagement principle in practice",
   body:"Designing multiple pathways into motivation for learners who arrive with very different reasons for being there, including those who would rather not be. Where engagement is not solved, little downstream can land.",
   ground:"UDL engagement principle; adult learning",link:"udl",status:"dev",connects:["ud1","lx1"]},
  {id:"ud4",cat:"udl",depth:3,name:"Closing the Knowing–Doing Gap",sub:"From understanding to changed practice",
   body:"Designing for the distance between what learners understand and what they actually do — the transfer problem seen through an inclusive lens. It shares its machinery with reflection at the experience level and with change at the systems level.",
   ground:"Transfer research; Universal Design for Learning",link:"udl",status:"built",connects:["ud1","lx5","sd2"]},
  {id:"ud5",cat:"udl",depth:2,name:"Onboarding Across Wide Experience Ranges",sub:"Multiple entry points and pathways",
   body:"Designing entry so newcomers and experienced practitioners can each begin where they are, without boring the one or losing the other. It is a representation-principle problem common to every sector.",
   ground:"UDL representation principle",link:"udl",status:"dev",connects:["ud1","lx2"]},
  {id:"ud6",cat:"udl",depth:2,name:"Making Accessibility More Than Compliance",sub:"Access as design quality, not a checklist",
   body:"Treating accessibility as a dimension of good design rather than a minimum legal standard met at the end. It is the conceptual bridge from inclusive learning design to the accessibility, disability and accommodation branch, and to the service line offered alongside it.",
   ground:"WCAG; UDL; inclusive design",link:"udl",status:"dev",alsoIn:"access",connects:["ud1","ac1","ac2","ac4"]},
  {id:"ud7",cat:"udl",depth:3,name:"Eliminating Construct-Irrelevant Barriers in Assessment",sub:"Measuring capability, not obstacles",
   body:"Removing features of an assessment that get in the way of demonstrating mastery without being part of what is measured, so results reflect capability rather than incidental barriers. It works alongside assessment designed as experience.",
   ground:"Construct validity; UDL action & expression",link:"udl",status:"built",alsoIn:"access",connects:["ud1","lx7","ac1","ac6"]},
  {id:"ud8",cat:"udl",depth:3,name:"Equity-Centered Learning Design",sub:"The social and cultural layer over everything",
   body:"Attending to power, culture, and whose knowledge is treated as legitimate across the whole design, rather than as a separate module. It connects directly to equity evaluation and to equity-centred knowledge mobilization.",
   ground:"Equity-centred and culturally responsive design",link:"udl",status:"dev",connects:["ud1","sd3","km9"]},
  {id:"ud9",cat:"udl",depth:2,name:"Scaling Personalization Without Scaling Cost",sub:"The production economics of flexibility",
   body:"Making multiple means of engagement, representation, and expression economically feasible at scale, increasingly with AI-assisted production. It is the meta-capability that makes the rest affordable to deliver.",
   ground:"Learning technology; AI-assisted design",link:"udl",status:"dev",connects:["ud1","km10"]},
  {id:"ud10",cat:"udl",depth:3,name:"Evaluating Whether Design Reduced Barriers",sub:"Closing the UDL cycle with evidence",
   body:"Measuring whether an inclusive design actually lowered barriers, rather than assuming that it did — ending on rigor rather than aspiration. It belongs to the shared evaluation family that runs across the practice.",
   ground:"Evaluation design; Universal Design for Learning",link:"udl",status:"dev",alsoIn:"access",connects:["ud1","lx9","sd3","ac16"]},

  /* ── KNOWLEDGE MOBILIZATION ── */
  {id:"km1",cat:"kmb",depth:3,name:"Research-to-Practice Learning Systems",sub:"The master framework for moving evidence",
   body:"The conceptual architecture for how research and evidence reach the people who can use them, and change what they do. It is the centrepiece the other knowledge-mobilization contributions instantiate in specific contexts.",
   ground:"Knowledge mobilization; implementation frameworks",link:"kmb",status:"built",connects:["c0","km2","lx4","ud4"]},
  {id:"km2",cat:"kmb",depth:3,name:"KMb Evaluation Design",sub:"Did the evidence change practice?",
   body:"Measurement built for knowledge mobilization specifically — indicators of uptake and changed practice, not only satisfaction or reach. It is referenced by every other contribution on this branch, and shared with the wider evaluation family.",
   ground:"KMb indicators; evaluation design",link:"kmb",status:"built",connects:["km1","ud10","sd3","lx9"]},
  {id:"km3",cat:"kmb",depth:3,name:"Implementation Science Learning Design",sub:"Translating implementation frameworks into design",
   body:"Turning established implementation-science frameworks into concrete design decisions, giving change and needs work a theoretical backbone. It is a shared language among senior practitioners in health and the public sector.",
   ground:"CFIR; EPIS; PARIHS",link:"kmb",status:"dev",connects:["km1","sd2","sd1"]},
  {id:"km4",cat:"kmb",depth:2,name:"Evidence Brief & Knowledge Product Design",sub:"Research outputs practitioners actually use",
   body:"Designing the artifacts that carry evidence — briefs, summaries, and tools — so they are usable by the people they are meant for. It is concrete, demonstrable, and widely hired for.",
   ground:"Knowledge translation; information design",link:"kmb",status:"dev",connects:["km1","lx8"]},
  {id:"km5",cat:"kmb",depth:3,name:"Co-Production & Participatory Design",sub:"Designing with knowledge users, not for them",
   body:"Involving the people who will use knowledge in designing how it moves — the integrated approach many research funders now expect. It draws directly on community design and facilitation.",
   ground:"Integrated knowledge translation; participatory design",link:"kmb",status:"dev",connects:["km1","lx4"]},
  {id:"km6",cat:"kmb",depth:2,name:"Policy & Public-Sector Knowledge Design",sub:"Rapid evidence to policy",
   body:"Designing evidence for the realities of policy process and the people who work within it, so research can inform decisions on the timelines government actually runs on.",
   ground:"Evidence-informed policy; knowledge mobilization",link:"kmb",status:"dev",connects:["km1","sd1","sd2"]},
  {id:"km7",cat:"kmb",depth:2,name:"Researcher Capacity Building",sub:"Helping researchers mobilize their own knowledge",
   body:"Building researchers' capability to carry their own work into practice — the skillset behind the emerging research-impact roles in universities and research institutes.",
   ground:"Capacity building; adult learning",link:"kmb",status:"dev",connects:["km1","lx3"]},
  {id:"km9",cat:"kmb",depth:3,name:"Indigenous & Equity-Centred KMb",sub:"Power-aware, community-led knowledge movement",
   body:"Mobilizing knowledge in ways that respect data sovereignty, plural ways of knowing, and the communities knowledge comes from. It is developed in relationship and with care, not as token coverage.",
   ground:"OCAP®; Two-Eyed Seeing; equity-centred design",note:"This contribution is developed in consultation and relationship, not authored in isolation.",link:"kmb",status:"dev",connects:["km1","ud8"]},
  {id:"km10",cat:"kmb",depth:2,name:"Digital & AI-Enabled KMb",sub:"AI-assisted access to evidence",
   body:"Using digital and AI tools to widen access to evidence and support its use, grounded in real knowledge-mobilization practice rather than novelty. It shares its production questions with scalable personalization.",
   ground:"Learning technology; responsible AI",link:"kmb",status:"dev",connects:["km1","ud9"]},
  {id:"km_cop",cat:"kmb",depth:2,name:"Communities of Practice Design for KMb",sub:"Peer structures that sustain evidence use",
   body:"Designing the peer-learning structures — communities of practice — that keep evidence in use over time rather than letting it fade after a single push. It is the knowledge-mobilization application of community design and facilitation.",
   ground:"Communities of practice (Wenger)",link:"kmb",status:"dev",connects:["area_kmb","km1","lx4"]},

  /* ── LEARNING SYSTEMS DESIGN ── */
  {id:"sd4",cat:"lsd",depth:3,name:"Learning Design at the Systems Level",sub:"How learning functions across a whole organization",
   body:"Designing learning as an organizational system — governance, infrastructure, and sustainment — rather than as a set of isolated programs. It is the capstone that situates every other contribution inside the institution.",
   ground:"Systems thinking; organizational learning",link:"lsd",status:"dev",connects:["c0","sd1","sd2"]},
  {id:"sd1",cat:"lsd",depth:3,name:"Needs Analysis for Organizational Transformation",sub:"Diagnosing the problem before proposing a solution",
   body:"Entering an organization by asking the right diagnostic questions first — where intentions and outcomes have drifted apart — so design addresses the real problem. It is the organizational scale of learner research.",
   ground:"Needs analysis; gap analysis",link:"lsd",status:"built",connects:["sd4","lx6","km3","km6"]},
  {id:"sd2",cat:"lsd",depth:3,name:"Change Management Through Learning Design",sub:"Moving organizations, not just running courses",
   body:"Designing learning as the mechanism of organizational change, for institutions navigating transformation with limited capacity to manage it well. It is a frequent, legible need in higher education and the public sector.",
   ground:"Change management; implementation",link:"lsd",status:"built",connects:["sd4","ud4","km3"]},
  {id:"sd3",cat:"lsd",depth:3,name:"Equity Evaluation Framework Design",sub:"Measuring equity, not only designing for it",
   body:"Frameworks that measure whether a design advanced equity, extending evaluation into territory organizations are increasingly accountable for. It belongs to the shared evaluation family across the practice.",
   ground:"Equity evaluation; measurement",link:"lsd",status:"dev",connects:["sd4","ud8","ud10","km2"]},
  {id:"sd5",cat:"lsd",depth:2,name:"Scenario-Based Learning Design for Complex Practice",sub:"Designing for judgment under real conditions",
   body:"Designing learning around realistic scenarios so practitioners build judgment for complex, ambiguous situations. It is widely applicable across professional practice in every target sector.",
   ground:"Situated learning; case-based design",link:"lsd",status:"dev",connects:["sd4","lx3"]},
  {id:"sd6",cat:"lsd",depth:2,name:"Storyboarding for Learning Design",sub:"Making the design visible before it is built",
   body:"A craft method for planning and communicating a learning experience before production, so decisions are deliberate and shared. It shows how the work is done, not only what it concludes.",
   ground:"Storyboarding; design process",link:"lsd",status:"dev",connects:["sd4","lx8"]},
  {id:"sd8",cat:"lsd",depth:2,name:"Wellness-Integrated Learning Environment Design",sub:"Designing for the conditions learning depends on",
   body:"Designing learning environments that account for the human conditions — including wellbeing and the social determinants of participation — that shape whether learning can happen at all.",
   ground:"Wellbeing; social determinants of learning",link:"lsd",status:"dev",connects:["sd4","ud8"]},
  {id:"sd9",cat:"lsd",depth:2,name:"Learning Design for Emergent Learning",sub:"Structure for learning that cannot be fully pre-planned",
   body:"Designing for contexts where outcomes genuinely cannot be specified in advance, providing structure for learning that emerges through the work itself. It is the most exploratory contribution in the systems line.",
   ground:"Complexity; emergent design",link:"lsd",status:"dev",connects:["sd4","lx5"]},
  {id:"sd_org",cat:"lsd",depth:3,name:"Organizational Learning Design",sub:"Learning as an organizational capability",
   body:"Designing the structures, roles, and routines through which an organization learns as a whole — so capability is built into how the institution works, not left to individual programs.",
   ground:"Organizational learning (Senge)",link:"lsd",status:"built",connects:["area_lsd","sd4","sd1"]},
  {id:"sd_eval",cat:"lsd",depth:3,name:"Learning Evaluation Framework Design",sub:"Knowing whether learning worked",
   body:"Designing frameworks that measure whether learning achieved what it set out to — outcomes and impact, not only satisfaction — so decisions rest on evidence. It belongs to the shared evaluation family across the practice.",
   ground:"Evaluation design (Kirkpatrick)",link:"lsd",status:"built",connects:["area_lsd","sd3","km2","ud10"]},
  {id:"sd_curric",cat:"lsd",depth:3,name:"Curriculum Mapping Design",sub:"Coherence across a whole program",
   body:"Mapping outcomes, assessments, and experiences across an entire curriculum so a program holds together as a coherent whole rather than a set of disconnected courses. It is the program-scale companion to backward design.",
   ground:"Curriculum alignment; backward design",link:"lsd",status:"built",connects:["area_lsd","lx8","sd6"]},

  /* ── ACCESSIBILITY, DISABILITY & ACCOMMODATION — KNOWLEDGE RESOURCES ── */
  {id:"ac4",cat:"access",depth:4,name:"Why Universal Design Never Eliminates Individual Accommodation",sub:"The anchor · why both are permanent, and both are skilled",
   body:"Individual accommodation is not a residue left behind by imperfect design. Human variability has no outer edge, some barriers are the very thing an assessment is meant to measure, and the duty is owed to a person rather than discharged by a process — which is why proactive design and individual accommodation remain complementary, and why the accommodation encounter is skilled professional practice rather than an administrative step.",
   ground:"Inclusive design and one-size-fits-one; the duty to accommodate; construct validity",link:"access",status:"dev",
   connects:["c0","ud2","ud6","ac5","ac6","ac8"]},
  {id:"ac5",cat:"access",depth:3,name:"The Duty to Accommodate in Learning Design",sub:"The legal frame, written for those who build and teach",
   body:"The architecture within which access decisions are made and defended: the procedural and substantive duty, the unified bona fide requirement test, and accommodation to the point of undue hardship, set in the Canadian frame with the cross-border standards that vendor and partnership work require. It is offered as synthesis for designers, faculty, and institutions; determinations in individual cases rest with accessibility advisors and accommodation offices, and with legal counsel where a matter becomes contested.",
   ground:"Meiorin and the BFOR test; Accessible Canada Act; BC Human Rights Code; Accessible British Columbia Act; ADA and Sections 504/508",link:"access",status:"dev",
   connects:["ac4","ac6","ac16"]},
  {id:"ac6",cat:"access",depth:3,name:"Essential Requirements and the Limits of Flexibility",sub:"What a standard genuinely requires, articulated in advance",
   body:"The most demanding judgment in the field: when flexibility preserves what is being measured, and when it alters it. This resource supports programs in articulating their essential requirements before any dispute arises — separating what a standard genuinely requires from what it has inherited by convention — so that the reasoning is available to everyone who later needs it.",
   ground:"Construct validity; constructive alignment; bona fide academic and technical standards",link:"access",status:"dev",
   connects:["ac4","ud7","ac14","lx8"]},
  {id:"ac7",cat:"access",depth:3,name:"Disability Studies for Learning Designers",sub:"The grounding that changes what a designer sees",
   body:"Social, medical, and interactional models of disability; ableism as institutional structure rather than individual attitude; disability as identity, culture, and political community. It is the grounding that allows a barrier to be named as a design failure rather than a learner’s deficit, and it is what distinguishes accessibility practice from compliance administration.",
   ground:"Social model (Oliver); academic ableism (Dolmage); Titchkosky; Kafer",link:"access",status:"dev",
   connects:["ac4","ac9","ud8"]},
  {id:"ac8",cat:"access",depth:3,name:"Designing Out the Disclosure Requirement",sub:"Disclosure burden as a design variable",
   body:"Access that is gated behind disclosure asks a person to name a private matter to someone holding authority over them, and the documented costs of that request are real: anticipated stigma, delay, and for some, a decision not to ask at all. This resource treats disclosure burden as something design can measure and reduce — why a flexible deadline requiring an email is a disclosure event and a built-in buffer is not — while leaving the accommodation record itself where it belongs, with the office that holds it.",
   ground:"Stigma and concealment (Goffman); academic ableism; BC information-governance requirements",link:"access",status:"dev",
   connects:["ac4","ac7","ac13"]},
  {id:"ac9",cat:"access",depth:3,name:"Partnering with Disabled People in Learning Design",sub:"Co-design without extraction",
   body:"Structuring lived-experience partnership so that it is compensated, early enough to shape decisions rather than ratify them, and accessible in its own conduct. It attends to the pattern in which technical expertise quietly eclipses lived experience, and favours partnership with disability-led organizations already doing this work over convening participants anew.",
   ground:"Nothing about us without us (Charlton); inclusive design; TCPS 2 research ethics",link:"access",status:"dev",
   connects:["ac7","km5","ac18"]},
  {id:"ac10",cat:"access",depth:3,name:"Accessibility Triage for Existing Course Inventories",sub:"A defensible order of work when everything cannot be fixed at once",
   body:"Most institutions hold thousands of documents, modules, videos, and pages built before anyone was checking, with no realistic path to full conformance. This resource offers a tiered protocol — what is remediated now, what is rebuilt at next revision, what is retired, and which standard applies to each tier — using high-volume required and compliance training as the worked example.",
   ground:"WCAG 2.2; EN 301 549; remediation prioritisation",link:"access",status:"dev",
   connects:["ac12","ac11","ac1"]},
  {id:"ac11",cat:"access",depth:3,name:"Designing for the Assistive Technology People Actually Use",sub:"Why conformant content can still fail in practice",
   body:"Conformance and assistive-technology fluency are not the same thing, and the difference shows quickly in real use. This resource covers testing with actual assistive technology rather than automated checking alone, and the reasons technically conformant material can still obstruct — while leaving assessment, tool matching, and training to the assistive technology specialists and advisors whose professional work that is.",
   ground:"SETT framework (Zabala); HAAT model (Cook & Polgar); WCAG 2.2",link:"access",status:"dev",
   connects:["ac10","ac12","ac1"]},
  {id:"ac12",cat:"access",depth:3,name:"Accessible Procurement and Vendor Accountability",sub:"The decisions made before anything is built",
   body:"An inaccessible platform, once purchased, sets the ceiling on everything designed inside it. This resource covers reading an accessibility conformance report critically rather than accepting it at face value, using recognised standards as procurement criteria, writing remediation commitments into agreements, and piloting with disabled users before signature.",
   ground:"EN 301 549; WCAG 2.2; VPAT and accessibility conformance reports",link:"access",status:"dev",
   connects:["ac10","ac11","ac16"]},
  {id:"ac13",cat:"access",depth:3,name:"Designing for Episodic and Fluctuating Conditions",sub:"Program architecture for conditions that vary",
   body:"Attendance policy, deadline architecture, cohort progression, and leave-and-return pathways — the structural layer of a problem that individual accommodation handles with difficulty because most systems assume stable limitations. It is program and policy design, offered in the knowledge that disabled people and experienced advisors hold far more understanding of these conditions than the design literature yet reflects.",
   ground:"Episodic disability framework (O’Brien et al.); disability studies",link:"access",status:"dev",
   connects:["ac8","ac6","sd8"]},
  {id:"ac14",cat:"access",depth:3,name:"Access in Clinical and Placement Education",sub:"Holding patient safety and access seriously at once",
   body:"Placement, simulation, precepting, and competency assessment are where essential requirements are most contested and where safety arguments can close conversations that deserve to stay open. This resource works through the design and assessment architecture that allows a program to protect genuine safety requirements while examining the ones it has never had reason to question.",
   ground:"Technical standards in health professions education (Meeks & Jain); construct validity; duty to accommodate",link:"access",status:"dev",
   connects:["ac6","ac17","sd9"]},
  {id:"ac15",cat:"access",depth:3,name:"Faculty Development That Changes Accessible Practice",sub:"From awareness to what instructors actually do",
   body:"Institutions have offered accessibility and inclusive design workshops for years, often with limited change in daily teaching practice. This resource diagnoses whether the gap is capability, opportunity, or motivation, then designs accordingly — point-of-need supports, discipline-specific exemplars, and department-embedded work — with any content on legal obligation delivered alongside the accommodation office rather than independently of it.",
   ground:"COM-B and the Behaviour Change Wheel (Michie et al.); adult learning; UDL",link:"access",status:"dev",
   connects:["ud4","ac3","ac16","lx4"]},
  {id:"ac16",cat:"access",depth:3,name:"Institutional Accessibility Planning as a Change Program",sub:"From a published plan to demonstrable change",
   body:"Statutory obligation produces an accessibility plan, a committee, and a feedback mechanism; it does not by itself produce sequencing, ownership, or capability. This resource brings systems design and change management to accessibility governance, and is written for a contributing role on an institutional plan rather than for authorship of an institution’s accessibility position.",
   ground:"Accessible Canada Act; Accessible British Columbia Act; change management; systems thinking",link:"access",status:"dev",
   connects:["ac5","ud10","sd2","sd4"]},
  {id:"ac17",cat:"access",depth:3,name:"Accessible Health and Patient Education",sub:"Access beyond the learner, to the person receiving care",
   body:"Health literacy, plain language, communication access, and accessible patient education and informed consent, set against the documented health disparities disabled people experience. It is the point at which accessible learning design reaches materials intended for patients and the public rather than for students and staff.",
   ground:"Health literacy (Nutbeam); disability health disparities (Krahn et al.); social determinants of health",link:"access",status:"dev",
   connects:["ac14","sd8","ud1"]},
  {id:"ac18",cat:"access",depth:3,name:"Accessible Research Participation and Knowledge Products",sub:"Who can take part, and who can read the findings",
   body:"Consent materials, participant-facing instruments, plain-language summaries, and accessible dissemination — increasingly expected by research ethics boards and funders, and rarely designed for. It sits at the junction of knowledge mobilization and accessibility, where a study’s reach is set as much by its materials as by its recruitment.",
   ground:"TCPS 2 (2022); knowledge mobilization; WCAG 2.2",link:"access",status:"dev",
   connects:["ac9","km4","km1"]},
  {id:"ac19",cat:"access",depth:3,name:"Models of Disability as Design Decisions",sub:"The frame chosen before any design decision is made",
   body:"Medical, social, biopsychosocial, economic, functional solutions, social identity or cultural affiliation, and charity — seven models in active circulation, each of which settles in advance what counts as the problem and who is obliged to act on it. This resource sets them beside one another with their strengths and their costs, and treats the choice of model as a design decision rather than a philosophical preference, because the model implicit in a project brief is usually the model that shapes what gets built.",
   ground:"ICF (WHO, 2001); social model (Oliver); Retief & Letšosa; Shakespeare",link:"access",status:"dev",
   connects:["ac7","ac4","ud2"]},
  {id:"ac20",cat:"access",depth:3,name:"Disability Categories and the Barriers People Meet",sub:"The reference layer, written barrier-first",
   body:"Visual, auditory, deafblind, speech, mobility and body structure, cognitive and learning, seizure, and psychological disabilities, each set against the barriers people actually encounter in digital and physical environments. It is written barrier-first rather than diagnosis-first, so that a designer reaches for the environmental change rather than the label — and it is the reference layer that the more argumentative resources on this branch quietly assume a reader already holds.",
   ground:"ICF (WHO, 2001); WCAG 2.2; disability studies",link:"access",status:"dev",
   connects:["ac11","ac19","ac13"]},
  {id:"ac21",cat:"access",depth:3,name:"Assistive Technology and Adaptive Strategies",sub:"What exists, and what it does for a person",
   body:"Screen readers, magnification, speech input, alternative pointing, augmentative and alternative communication, hearing technologies, and the low-technology and adaptive strategies used at least as often — described by what they accomplish for a person rather than by product name, and paired with the frameworks that structure a selection decision. It is the survey that has to precede the harder question of why conformant content still fails against the technology people actually use.",
   ground:"HAAT model (Cook & Polgar); SETT framework (Zabala); WHO assistive technology guidance",link:"access",status:"dev",
   connects:["ac11","ac20","ac12"]},
  {id:"ac22",cat:"access",depth:3,name:"Disability Data and the Limits of Prevalence Figures",sub:"Why the numbers disagree, and how to use one honestly",
   body:"Measurement by diagnosis, by function, or by self-identification produces materially different populations, which is why global and national prevalence figures diverge so widely and why the choice of instrument is never neutral. This resource covers the major global and Canadian sources and their known undercounts, and how to carry a number into a business case or a funding application without asking it to bear more weight than it can.",
   ground:"WHO World Report on Disability; WHO Global Report on Health Equity for Persons with Disabilities; Canadian Survey on Disability; ICF",link:"access",status:"dev",
   connects:["ac17","ac16","km4"]},
  {id:"ac23",cat:"access",depth:3,name:"Disability Etiquette and Communication in Learning Environments",sub:"Professional practice, not a list of prohibitions",
   body:"Person-first and identity-first language and why the choice belongs to the person rather than the institution; addressing someone directly rather than their interpreter or support worker; offering assistance without presuming it is wanted or acting before it is accepted. It is written for facilitators and instructors as professional communication practice, on the understanding that the failures that matter in a learning room are rarely failures of intention and almost always failures of default behaviour under time pressure.",
   ground:"Disability etiquette guidance (United Spinal Association); CRPD; disability studies",link:"access",status:"dev",
   connects:["ac3","ac9","ac7"]},
  {id:"ac24",cat:"access",depth:3,name:"International and Regional Disability Rights Instruments",sub:"The layer above domestic duty",
   body:"The Universal Declaration of Human Rights, the Convention on the Rights of Persons with Disabilities and its General Comments, and the Marrakesh Treaty, together with the regional instruments — the Charter of Fundamental Rights of the European Union, the African Charter on Human and Peoples’ Rights, and the Inter-American Convention. It explains why accessibility obligations converge across jurisdictions rather than arising independently in each, and supplies the vocabulary required to work with partners outside Canada.",
   ground:"UDHR (1948); CRPD (2006); Marrakesh Treaty (2013); regional human rights instruments",link:"access",status:"dev",
   connects:["ac5","ac16","ac9"]},
  {id:"ac25",cat:"access",depth:3,name:"Accessible Physical and Hybrid Learning Environments",sub:"The part of universal design most often handed to facilities",
   body:"The seven principles of universal design as they were originally written — for buildings, spaces, and products — and what they require of a classroom, a laboratory, a placement site, and the hybrid arrangements that now carry a large share of teaching. It is the part of universal design that learning designers most often hand to facilities management, and the part that determines whether a person can be present in the room at all.",
   ground:"Principles of Universal Design (Connell et al., 1997); CSA B651; Accessible Canada Act",link:"access",status:"dev",
   connects:["ac4","ac14","ud6"]},

  /* ── ACCESSIBILITY SERVICES · Accessible Learning Labs ── */
  {id:"ac1",cat:"access",depth:3,name:"Accessibility Review",sub:"Service · Accessible Learning Labs",
   body:"A rigorous review of learning environments that holds four interconnected bodies of knowledge in view at once, producing findings a surface-level compliance check cannot. It is offered as a specific, scoped service.",
   ground:"WCAG; UDL; disability studies; systems knowledge",link:"acc_review",status:"service",connects:["c0","ud6","lx7","ac2","ac10"]},
  {id:"ac2",cat:"access",depth:3,name:"Inclusive Course & Curriculum Design",sub:"Service · Accessible Learning Labs",
   body:"Inclusive design of courses and curricula for faculty, designers, and curriculum committees — integrating design frameworks, pedagogy, and the systems knowledge that makes change endure. It is offered as a specific service.",
   ground:"UDL; backward design; assessment equity; systems knowledge",link:"acc_curric",status:"service",connects:["ac1","ud6","lx8","ac6"]},
  {id:"ac3",cat:"access",depth:3,name:"Inclusive Facilitation & Capacity Building",sub:"Service · Accessible Learning Labs",
   body:"Facilitation understood as a professional stance shaped by how power, identity, and legitimate knowledge are held — and the building of others' capacity to facilitate inclusively. It is offered as a specific service.",
   ground:"Power-aware facilitation; adult learning; equity",link:"acc_facil",status:"service",connects:["ac1","lx4","lx3","ac15"]},


  /* ── EPISTEMOLOGY ──────────────────────────────────────────────────────
     What decides whether a knowledge claim is admitted, discounted, or never
     formed at all. A contribution belongs here only where the failure happens
     before appraisal rather than during it; appraisal itself remains trunk work.
     The branch coordinates with the Indigenous-led contributions held elsewhere
     on the map and does not contain them. */

  {id:"ep0",cat:"epist",depth:4,name:"What a Sound Knowledge Process Looks Like",
   sub:"The entry node · the standard the rest of the branch measures against",
   body:"Four conditions rendered for design work: real avenues through which criticism can travel while a decision can still change, demonstrable uptake of that criticism, standards of evidence agreed before evidence is gathered, and authority that tracks relevant knowledge rather than rank. They are necessary rather than sufficient — they make error detectable, not absent — and the fourth cannot be self-certified, which is why it is written as an arrangement a process submits to rather than a check it performs on itself.",
   ground:"Critical contextual empiricism (Longino); strong objectivity (Harding); veritistic social epistemology (Goldman)",
   link:"epist",status:"planned",connects:["c0","ep1","ep2","ep10","ld15"]},

  {id:"ep1",cat:"epist",depth:4,name:"When Testimony Becomes Evidence",
   sub:"The criterion an evidence hierarchy cannot supply",
   body:"What makes a firsthand account count as evidence, and equally what makes a claim fail regardless of who holds it. It is the contribution that keeps a widened set of knowers from becoming an unlimited set of claims, and it leaves appraisal discipline — distinguishing a robust finding from folklore — fully intact.",
   ground:"Epistemology of testimony (Coady; Lackey); epistemic dependence (Hardwig); testimonial injustice (Fricker)",
   link:"epist",status:"planned",connects:["ep0","ep6","ld14","ld15","km4"]},

  {id:"ep2",cat:"epist",depth:3,name:"The Invisible Rules of Admissibility",
   sub:"The diagnostic · specifiable rules rather than bias",
   body:"Sequencing, genre, the credential gate, proxy substitution, small-n erasure, safety closure, and the upstream lock: named filters that settle what enters a record before anything in it is weighed. Naming them as rules rather than as bias is what makes them examinable, and correctable, by the room that has just applied one.",
   ground:"Epistemic injustice (Fricker; Dotson); socio-legal work on admissibility, expert qualification, and burden of proof",
   link:"epist",status:"planned",connects:["ep0","ep4","ld3","ld15","ac9"]},

  {id:"ep3",cat:"epist",depth:3,name:"Knowledge That Was Never Produced",
   sub:"The absence that leaves no trace",
   body:"Questions never funded, populations never studied, outcomes never defined. Nothing was excluded because nothing was submitted, which makes non-production the likeliest reason an evidence base looks thin and the hardest thing to detect from inside a literature search.",
   ground:"Agnotology (Proctor & Schiebinger); structured ignorance (Mills); Tuana",
   link:"epist",status:"planned",connects:["ep2","km1","ac22","ld15"]},

  {id:"ep4",cat:"epist",depth:3,name:"Experience Without Language",
   sub:"Hermeneutical injustice · when the account cannot be formed",
   body:"Nobody is disbelieved and no claim is rejected: the concept required to state the experience does not yet exist in the shared interpretive resource. It leaves no trace in a consultation record, so a process that measures only what was said will read it as an absence of concern.",
   ground:"Hermeneutical and contributory injustice (Fricker; Dotson); idioms of distress (Nichter); Kleinman",
   link:"epist",status:"planned",connects:["ep2","ep9","ac13","ud8"]},

  {id:"ep5",cat:"epist",depth:5,name:"Making as Knowing",
   sub:"Whether knowing-how is knowledge in the same sense",
   body:"The form of knowledge most present in craft, facilitation, and clinical practice, and least legible to a hierarchy built for claims. Elicitation methods presuppose an answer to this question and rarely state it, which is the point at which a tacit account is either carried into a design or lost at the interview.",
   ground:"Knowing-how (Ryle); tacit knowledge (Polanyi; H. Collins); reflective practice (Schön)",
   link:"epist",status:"planned",connects:["ep6","ld3","lx3","ac3"]},

  {id:"ep6",cat:"epist",depth:4,name:"Warranted Trust and the Division of Cognitive Labour",
   sub:"When deference is well-grounded rather than deferential",
   body:"Nobody verifies most of what they know, so dependence is the ordinary condition of expertise rather than a lapse in it. This contribution sets out the grounds on which trust in an expert, a source, or a community is warranted, alongside the documented cases in which expertise established outside formal credentials has held up against expertise inside them.",
   ground:"Epistemic dependence (Hardwig); epistemology of expertise (Goldman); interactional expertise (Collins & Evans); civic epistemology (Jasanoff)",
   link:"epist",status:"planned",connects:["ep0","ep1","ld3","ld14"]},

  {id:"ep7",cat:"epist",depth:3,name:"Designing Under Disagreement",
   sub:"Deciding and building when knowledgeable people conflict",
   body:"Disagreement between well-informed people working inside a single framework, where a decision still has to be made and something still has to be built to a deadline. It covers what the disagreement is itself evidence of, and which deliberative arrangements produce a defensible decision rather than the loudest one.",
   ground:"Peer disagreement (Feldman & Warfield); deliberative method (Fishkin; Landemore); participatory design (Ehn)",
   link:"epist",status:"planned",connects:["ep0","km5","ld2","sd9"]},

  {id:"ep8",cat:"epist",depth:2,name:"When Integration Becomes Assimilation",
   sub:"Where synthesis is the wrong instrument",
   body:"Two knowledge systems can answer the same question incompatibly, and integrating them under unequal power absorbs one into the other. Holding the conflict open is an arrangement to be maintained rather than a deliverable to be produced. This contribution coordinates with the Indigenous-led work held elsewhere on the map and does not stand in for it.",
   ground:"Ethical space (Ermine); Two-Eyed Seeing (Bartlett, Marshall & Marshall); legal pluralism",
   link:"epist",status:"planned",connects:["ep7","km9","ld27"]},

  {id:"ep9",cat:"epist",depth:4,name:"The Construct Inside the Measure",
   sub:"How an instrument decides which outcomes become visible",
   body:"An instrument encodes a construct, and choosing it settles in advance what will be able to register as an outcome. Where the construct does not hold in the setting, the measure returns nothing on something that worked, or an effect on something nobody intended.",
   ground:"Construct validity (Messick; Borsboom et al.); category fallacy (Kleinman); idioms of distress (Nichter)",
   link:"epist",status:"planned",connects:["ep4","ac14","ud7","sd_eval","km2"]},

  {id:"ep10",cat:"epist",depth:3,name:"The Designer\u2019s Own Position",
   sub:"The assumptions a method cannot catch on its own",
   body:"No method examines the assumptions it was built on, and elicitation presumes a neutral extractor. The correction is criticism from a differently positioned knower holding authority to overrule — an arrangement submitted to rather than a process run — which applies to the designer the same condition a sound knowledge process is asked to meet.",
   ground:"Strong objectivity (Harding); situated knowledges (Haraway); Wylie; Hill Collins; Longino",
   link:"epist",status:"planned",connects:["ep0","lx6","km5","ac9"]},

  /* ── TRUNK · LEARNING DESIGN CRAFT ──────────────────────────────────────
     The shared practice everything else grows from. Two concentric rings inside
     the nine branches: the inner ring is about making the work, the outer ring
     about the standards and obligations it answers to, and what sustains it. Depth here means how settled
     the contribution is in the field, not how built out it is here. */

  /* Inner ring — making the work */
  {id:"ld1",cat:"trunk",ring:1,depth:4,name:"Telling a Learning Need from a Performance Problem",
   sub:"The question asked before anything is designed",
   body:"A request for training usually arrives attached to a problem training cannot fix — unclear expectations, missing tools, broken incentives, understaffing, a marking load nobody costed, a prerequisite that quietly stopped being taught. Diagnosing which is which, before any design begins, changes the outcome more than any later decision will. It is also the step most often skipped.",
   ground:"Behaviour engineering (Gilbert); performance analysis (Mager & Pipe); Rummler & Brache",
   link:"trunk",status:"planned",connects:["ld26","ld2","sd1"]},

  {id:"ld2",cat:"trunk",ring:1,depth:4,name:"Scoping and the Decision Gate",
   sub:"Correcting while correction is still cheap",
   body:"Designs get built well past the point where changing them stops being affordable. A named milestone, a defined output, and a structured reassessment before more is committed — whether what is being committed is a budget or someone’s unpaid hours — is what keeps a project correctable rather than merely finishable.",
   ground:"Project scoping and staged decision-making",
   link:"trunk",status:"planned",connects:["ld1","ld8","ld16"]},

  {id:"ld3",cat:"trunk",ring:1,depth:5,name:"Working with Subject-Matter Experts",
   sub:"Surfacing what an expert can no longer see",
   body:"Drawing out tacit knowledge, running review cycles that converge, and holding design integrity when the expert is also the partner who approves the work. Experts forget what was once hard for them, and cannot tell you what they have stopped noticing. Getting that knowledge out takes a deliberate method, not a good conversation.",
   ground:"Cognitive task analysis; expert blind spot (Nathan & Petrosino)",
   link:"trunk",status:"planned",connects:["ld23","ld13","ld2"]},

  {id:"ld4",cat:"trunk",ring:1,depth:2,name:"Onboarding a Partner into Learning Design",
   sub:"How someone learns to commission this work",
   body:"Few partners know what to ask a learning designer for, what they will be asked to supply, or what good looks like when it arrives. That holds for an organization with a procurement process and for a single person with a course, a deadline, and no budget line at all. The intake, the shared vocabulary, and the first engagement are design problems in their own right.",
   ground:"Developed in practice; client intake and needs assessment",
   link:"trunk",status:"planned",connects:["ld25","ld2","ld22"]},

  {id:"ld5",cat:"trunk",ring:1,depth:3,name:"Minimum Viable Content",
   sub:"Deciding what to cut, before anything is built",
   body:"The instinct to cover everything is the most reliable source of bloated, unfinishable learning. Deciding what genuinely must be present is an editorial judgment made before design begins — distinct from cognitive load, which is a limit on what working memory can hold once material is in front of someone.",
   ground:"Editorial scoping before design; cognitive load (Sweller)",
   link:"trunk",status:"planned",connects:["lx2","ld8","ld11"]},

  {id:"ld6",cat:"trunk",ring:1,depth:4,name:"Modality and Technology Selection",
   sub:"The tool decision comes after the analysis, not before it",
   body:"Modality follows from what the analysis found — who the learners are, what the constraint is, where the work happens. Tool-first decisions, where a platform is procured or centrally supported and then filled, are endemic in large institutions and produce design choices nobody made deliberately.",
   ground:"Media selection; analysis before tooling",
   link:"trunk",status:"planned",connects:["ld1","ld12","ld26"]},

  {id:"ld7",cat:"trunk",ring:1,depth:2,name:"AI-Assisted Design, and Where It Fails",
   sub:"What the tool is good for, and what it invents",
   body:"Where generative tools genuinely accelerate design work — outlining, variant generation, first-pass drafting — and the failure modes that make unreviewed output unusable: fabricated citations, plausible-sounding pedagogy with no evidence behind it, and quiet homogenisation of everything it touches.",
   ground:"Developed in practice; documented failure modes in generative tools",
   note:"This stays about generative tools in the designer’s hands. Their use by learners, and what that does to assessment, is a separate contribution.",
   link:"trunk",status:"planned",connects:["ld15","km10","ld14","ld30"]},

  {id:"ld8",cat:"trunk",ring:1,depth:3,name:"Designing Under Constraint",
   sub:"What good looks like when there isn\u2019t enough",
   body:"Budget, timeline, and capacity are the actual conditions of the work, not deviations from it — and where the partner is a volunteer, the scarcest of them is their attention. What to protect and what to let go when the ideal method is unavailable, which is the honest counterpart to every best-case process on this map.",
   ground:"Developed in practice",
   link:"trunk",status:"planned",connects:["ld5","ld25","ld2"]},

  {id:"ld26",cat:"trunk",ring:1,depth:4,name:"What to Build When the Answer Isn\u2019t a Course",
   sub:"Support placed at the moment the work happens",
   body:"Job aids, checklists, decision aids at the point of care, protocol cards, a worked-example set, a rubric released before the work starts, a clearer brief, a page that answers the question forty people are about to ask. Support available at the moment the task is performed rather than instruction delivered weeks earlier and expected to survive until it is needed — frequently where the measurable effect actually is.",
   ground:"Behaviour engineering (Gilbert); job aids (Rossett & Schafer); moments of need (Gottfredson & Mosher); checklist literature",
   link:"trunk",status:"planned",connects:["ld1","ud4","ld6","ld9"]},

  {id:"ld9",cat:"trunk",ring:1,depth:4,name:"Information and Data Visualization for Learning",
   sub:"Making structure visible so it gets read",
   body:"Complex technical content and evaluation findings arrive as prose and spreadsheets and stay unread. Process maps, decision trees, comparative frames, and results a governance or curriculum committee can take in within a minute. Wherever decisions are made by a committee reading on short time, this is often the whole deliverable rather than a garnish on one.",
   ground:"Graphical excellence (Tufte); multimedia principles (Mayer); Cairo",
   link:"trunk",status:"planned",connects:["km4","ld10","ld11"]},

  {id:"ld10",cat:"trunk",ring:1,depth:3,name:"Visual Language and Design Systems for Learning Programs",
   sub:"Making consistency economical instead of heroic",
   body:"Materials produced by many hands drift — inconsistent, off-brand, and inaccessible in the same recurring ways. Templates, type and colour decisions with contrast decided once, a media library, and a house style are what let quality hold without a specialist reviewing every artefact.",
   ground:"Design systems practice; WCAG contrast requirements",
   note:"This is what makes facilitation craft and design infrastructure work. Without it they are aspirations.",
   link:"trunk",status:"planned",connects:["ld22","ld9","ac10"]},

  {id:"ld11",cat:"trunk",ring:1,depth:5,name:"Plain Language and Writing for Learning",
   sub:"Reading load as a design decision",
   body:"How hard something is to read is usually the biggest barrier to understanding it, and it has nothing to do with the subject itself. It is also the barrier designers most often leave to chance. Reading load decides whether a patient follows their discharge instructions, whether a public notice meets its plain-language duty, whether a researcher can actually use a method someone has described, and whether a student can tell what an assignment is asking them to do.",
   ground:"ISO 24495-1; health literacy (Nutbeam)",
   link:"trunk",status:"planned",connects:["ac17","ud7","ld20"]},

  {id:"ld12",cat:"trunk",ring:1,depth:3,name:"Motion, Video and Multimedia Production",
   sub:"When moving image earns its cost",
   body:"The production craft — scripting, shot planning, capture, edit, captioning and audio description as part of production rather than remediation — and the judgment about when video is the right answer rather than the expected one.",
   ground:"Multimedia learning principles (Mayer)",
   link:"trunk",status:"planned",connects:["ld6","ld10","ac11"]},

  {id:"ld28",cat:"trunk",ring:1,depth:4,name:"How Learning Works, and Who Can Act on It",
   sub:"Told plainly to learners, and built into the design",
   body:"Most learners have never been told how consolidation works, why re-reading feels productive and isn\u2019t, or that difficulty is often the signal rather than the failure. This makes that knowledge available in plain language as something offered rather than assigned, and builds the regulating into the design — spacing in the schedule, retrieval in the activity, requirements stated plainly — because every strategy in this literature presupposes conditions that unequal circumstances do not distribute equally.",
   ground:"Learning How to Learn (Oakley & Sejnowski); desirable difficulties (Bjork); retrieval practice (Roediger & Karpicke); co-regulated and socially shared regulation (Hadwin & J\u00e4rvel\u00e4); scarcity and bandwidth (Mullainathan & Shafir)",
   link:"trunk",status:"planned",connects:["lx5","lx2","ld14","ud3"]},

  {id:"ld29",cat:"trunk",ring:1,depth:5,name:"Writing Outcomes That Can Be Assessed",
   sub:"Holding outcome, evidence and activity in one line",
   body:"Most outcomes state an aspiration no assessment can reach — appreciate, understand, be aware of — and most activities drift from whatever is finally marked. Naming what someone will be able to do, choosing the evidence that would show it, and building the activity that gets them there is the most-performed move in the craft and the one most often made by habit. It is also what makes a design reviewable by anyone who was not in the room when it was decided.",
   ground:"Constructive alignment (Biggs); backward design (Wiggins & McTighe); construct validity (Messick)",
   note:"Backward design on the experience branch applies this to one designed experience. Here it is the general move, applied to anything that claims to teach something.",
   link:"trunk",status:"planned",connects:["lx8","ld30","ud7","ld2"]},

  {id:"ld30",cat:"trunk",ring:1,depth:2,name:"Assessment When the Answer Can Be Generated",
   sub:"Designing tasks a model cannot sit in for",
   body:"Detection is unreliable, adversarial, and falls hardest on the people least able to contest it. The durable answers are in the task itself: work anchored to a particular context, a process that leaves a trail, evidence gathered in person at the points where it genuinely matters, and stated expectations about permitted use rather than a blanket prohibition nobody can enforce. The prior question is which capability a task is protecting, and whether it is worth protecting there.",
   ground:"Assessment security (Dawson); permitted-use scales (Perkins et al.); construct validity (Messick)",
   link:"trunk",status:"planned",connects:["ld29","ld7","ud7","ld15"]},

  {id:"ld31",cat:"trunk",ring:1,depth:3,name:"When the Consultation Is the Whole Intervention",
   sub:"One conversation, and no project behind it",
   body:"A great deal of this work is not a project. It is an hour with someone who has a course, a deadline, and the option of simply not writing back. What can be diagnosed, decided, and left behind in a single conversation is a different craft from running a scoped build, and it is where most of a practice’s actual reach lives. Designing that hour — what to ask, what to skip, what to leave in their hands — deserves the same attention as designing anything else.",
   ground:"Reflective practice (Sch\u00f6n); needs analysis (Rossett); adult learning (Knowles)",
   note:"Distinct from onboarding a partner, which assumes an engagement follows. This one assumes it may not.",
   link:"trunk",status:"planned",connects:["ld4","ld1","ld23","ld8"]},

  /* Outer ring — shared standards, obligations, and what sustains the work */
  {id:"ld13",cat:"trunk",ring:2,depth:4,name:"Quality Assurance as a Documented Practice",
   sub:"Accountable, recorded, and repeatable",
   body:"Review against instructional and accessibility standards, with the criteria written down, the reviewer named, and the result recorded. Distinct from remediating a legacy inventory: this is the check that runs before anything ships.",
   ground:"Standards-based review against instructional and accessibility criteria",
   link:"trunk",status:"planned",connects:["ac10","ld15","ld16"]},

  {id:"ld14",cat:"trunk",ring:2,depth:5,name:"Reading Learning Science Without Neuromyths",
   sub:"Telling the evidence from the folklore",
   body:"Learning styles, the retention pyramid, left-brain and right-brain, and the attention-span figures that circulate without a source. Reading primary evidence well enough to tell what is supported from what is merely widespread is a professional obligation, and the myths are most persistent precisely where budgets are decided.",
   ground:"Learning styles evidence (Pashler et al.); neuromyth prevalence (Dekker et al.; Howard-Jones)",
   link:"trunk",status:"planned",connects:["ld15","ld28","lx2"]},

  {id:"ld15",cat:"trunk",ring:2,depth:3,name:"Source Discipline in Knowledge Products",
   sub:"Can an independent reader confirm this?",
   body:"Citation integrity, fact-checking, and the verifiability test applied to learning materials rather than to research papers. The standard is whether a reader can confirm a claim without contacting the author — which most learning content, including most well-intentioned learning content, cannot meet.",
   ground:"Developed in practice; citation integrity and verifiability",
   link:"trunk",status:"planned",connects:["ld14","ld7","km4"]},

  {id:"ld27",cat:"trunk",ring:2,depth:4,name:"Supporting Indigenous-Led Learning Design",
   sub:"A settler designer\u2019s role, named at its actual size",
   body:"Design craft placed in service of Indigenous-led education and directed by Indigenous knowledge holders — never a claim to Indigenous knowledge, which is held in relationship and community and does not transfer to a portfolio. The scholarship belongs to Ramsden, Kirkness and Barnhardt, Archibald, Battiste, Ermine, and Tuhiwai Smith; what is offered here is process, plain language, accessibility, and production discipline in support of work whose direction is not the designer\u2019s to set.",
   ground:"Cultural safety (Ramsden); the Four R\u2019s \u2014 respect, relevance, reciprocity, responsibility (Kirkness & Barnhardt); Indigenous Storywork (Archibald); ethical space of engagement (Ermine); Decolonization Is Not a Metaphor (Tuck & Yang). Instruments: TRC Calls to Action 23 and 24; UNDRIP; BC\u2019s Declaration on the Rights of Indigenous Peoples Act; the First Nations principles of OCAP\u00ae; FNHA cultural safety and humility commitments.",
   note:"Cultural safety is determined by the person receiving the care or the teaching, never asserted by the person providing it \u2014 Ramsden\u2019s principle, from the origin of the concept in M\u0101ori nursing scholarship. A designer can work toward an environment being safer, and cannot certify it safe on someone else\u2019s behalf. This contribution describes contribution, not authority: it says what the design craft supplied and under whose direction.",
   link:"trunk",status:"planned",connects:["km9","ud8","ld19","ld11"]},

  {id:"ld16",cat:"trunk",ring:2,depth:3,name:"Designing for the Update Cycle",
   sub:"Who owns this after handover",
   body:"Content decays, and sustainment is usually retrofitted or never happens at all. Update triggers, review cycles, version control, and a named owner decided during design rather than discovered two years later when the material is quietly wrong.",
   ground:"Sustainment planning; knowledge management practice",
   link:"trunk",status:"planned",connects:["ld13","ld22","sd_org"]},

  {id:"ld17",cat:"trunk",ring:2,depth:4,name:"Designing Where the Work Must Satisfy a Reviewer",
   sub:"The tension between defensible and effective",
   body:"Required training, audit trails, accreditation evidence, and curriculum approval — and the real craft problem underneath, which is that review-driven design usually optimizes for the record rather than the learner. The reviewer may be a regulator, a professional accrediting body, an ethics board, or a curriculum committee. The pressure each puts on the design is the same, and so is the way out of it.",
   ground:"Regulatory and accreditation frameworks; competency assurance practice",
   link:"trunk",status:"planned",connects:["ld13","ld19","ld18"]},

  {id:"ld18",cat:"trunk",ring:2,depth:3,name:"Learner Data, Privacy and Analytics Ethics",
   sub:"What the learning function is actually allowed to hold",
   body:"Platform records, completion tracking, dashboards that identify individuals by accident, retention schedules, and what privacy law requires of a learning function that is usually not staffed to know. It also covers the assessment a third-party tool has to pass before anyone can be required to use it, and the alternative that has to exist when it has not. The default position — collect everything, decide later — is not lawful and not neutral.",
   ground:"FIPPA; PIPEDA; PHIPA; privacy impact assessment; learning analytics ethics (Slade & Prinsloo)",
   link:"trunk",status:"planned",connects:["ld19","ld17","ac8"]},

  {id:"ld19",cat:"trunk",ring:2,depth:4,name:"Ethics and Consent in Learner Research",
   sub:"What may be published, and on whose say-so",
   body:"Consent that is informed rather than assumed, anonymization that actually anonymizes in small populations, and a clear line about what may be quoted or published from research with participants. The line matters most when the participants are colleagues.",
   ground:"TCPS 2; research ethics practice",
   link:"trunk",status:"planned",connects:["ld18","lx6","ac18"]},

  {id:"ld20",cat:"trunk",ring:2,depth:3,name:"Multilingual Design and Localization",
   sub:"The difference between translated and designed",
   body:"Plain language before translation, terminology decided once, cultural adaptation rather than substitution, and the recognition that a translated course carries the structural assumptions of the original. A live requirement wherever services, research, or study run across languages — Canadian health and federal contexts, and any room where much of the group is working in an additional language.",
   ground:"ISO 24495-1; localization practice",
   link:"trunk",status:"planned",connects:["ld11","ac17","ud8"]},


  {id:"ld21",cat:"trunk",ring:2,depth:4,name:"Facilitation and Live Delivery Craft",
   sub:"What happens in the room",
   body:"Technique, timing, group dynamics, reading a room that has gone quiet, and recovering a session that is not working — where most public-sector and higher-education learning still actually happens, and the part least often written down.",
   ground:"Adult learning practice (Knowles); facilitation craft",
   link:"trunk",status:"planned",connects:["lx4","ac3","ld23"]},

  {id:"ld22",cat:"trunk",ring:2,depth:3,name:"Learning Design Infrastructure",
   sub:"What a practice needs in order to exist",
   body:"Templates, source libraries, a media gallery, working groups, and standards documented where someone other than their author can find them. The scaffolding that decides whether a design practice is a person or a capability.",
   ground:"Developed in practice; organizational learning (Senge)",
   note:"Distinct from organizational learning design, which is the organization\u2019s learning rather than the practice\u2019s own scaffolding.",
   link:"trunk",status:"planned",connects:["ld10","ld16","sd_org"]},

  {id:"ld23",cat:"trunk",ring:2,depth:3,name:"Building Design Capability in Non-Designers",
   sub:"Helping SMEs and faculty make decent materials",
   body:"Most learning content in any institution is made by people whose job is something else. Giving them a small number of decisions that matter, in a form they will actually use, does more for quality at scale than any single well-designed course. Where a small team supports a large institution, this is not a secondary mode of delivery. It is the main one.",
   ground:"Adult learning practice (Knowles); behaviour change (Michie)",
   link:"trunk",status:"planned",connects:["ac15","km7","ld3"]},

  {id:"ld24",cat:"trunk",ring:2,depth:3,name:"Competency Development for Learning Designers",
   sub:"What the work requires, on a scale you can use",
   body:"An eight-competency framework with a four-level scale, written for self-review, hiring, and team capability mapping. Peer-facing, and the kind of artefact the field mostly keeps in private documents rather than publishing.",
   ground:"Developed in practice; competency frameworks and self-assessment",
   link:"trunk",status:"planned",connects:["ld23","ld22","ld3"]},

  {id:"ld25",cat:"trunk",ring:2,depth:3,name:"Arguing for the Work Before the Constraint Is Set",
   sub:"Making the case while there is still something to decide",
   body:"Cost, effort, and how the work is justified — sometimes to somebody holding a budget who has seen learning functions produce very little, and sometimes to a partner being asked for hours already owed to research, teaching, and service. The second argument is the harder one, because there is no line item to point at. Distinct from designing well inside a constraint: this is the case made before the constraint exists, and its strongest version includes recommending against building a course.",
   ground:"Evaluation and impact frameworks (Kirkpatrick); practice-derived",
   link:"trunk",status:"planned",connects:["ld8","ld26","sd_eval"]},

  {id:"ld32",cat:"trunk",ring:2,depth:3,name:"Reading Course Signals Without Overreading Them",
   sub:"Feedback, evaluations, and platform data",
   body:"Learner feedback, end-of-term evaluation instruments, and platform analytics each answer a narrower question than they appear to. Evaluation instruments carry documented bias by instructor gender; platform data records activity rather than learning; open comments are a self-selected sample in which the unhappy are overrepresented. Knowing what each signal can and cannot support is the difference between a revision that helps and one that chases the loudest few.",
   ground:"Bias in student ratings of teaching (MacNell et al.); learning analytics ethics (Slade & Prinsloo); construct validity (Messick)",
   link:"trunk",status:"planned",connects:["ld18","ld16","lx9","ld13"]},

  {id:"ld33",cat:"trunk",ring:2,depth:3,name:"Designing Inside a Research Culture",
   sub:"No authority, and a partner whose first obligation is elsewhere",
   body:"In institutions built around producing knowledge, the person being designed with is an expert in their own field first, holds more standing in it than the designer does, and is taking part voluntarily. Nothing can be required. The evidence has to meet the standard they apply to their own discipline, which is higher than the one most learning content is written to. And the design has to survive a term in which teaching is one obligation of three. The craft is influence without authority, and evidence good enough for a sceptical expert.",
   ground:"Adult learning (Knowles); expert blind spot (Nathan & Petrosino); evidence use (Nutley)",
   note:"Distinct from working with subject-matter experts, which is about eliciting what they know. This is about the conditions under which they can be worked with at all.",
   link:"trunk",status:"planned",connects:["ld3","ld23","ld31","ld14"]},


  /* ==== Later additions: Evaluation, Public Learning, Human Rights Education,
     and the making, work-integrated, prioritization, governance and
     safety-critical clusters. Marked so reference numbering for the earlier
     contributions is preserved. ==== */
